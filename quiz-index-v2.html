<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ควิซการวิเคราะห์ข้อมูล (ชุด 1 และ 2)</title>
<meta name="description" content="แบบฝึกหัดปรนัยการวิเคราะห์ข้อมูล 2 ชุด ชุดละ 50 ข้อ พร้อมเฉลยและคำอธิบายทันทีหลังตอบ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--line:#dfe4ec;--accent:#2563eb;--accent-soft:#e8f0fe;--ok:#15803d;--ok-bg:#e7f6ec;--bad:#b42318;--bad-bg:#fdecea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141c;--card:#171e29;--text:#e8ecf3;--muted:#98a2b3;--line:#2a3342;--accent:#6ea0ff;--accent-soft:#1c2a44;--ok:#5fd38a;--ok-bg:#12301f;--bad:#ff8f84;--bad-bg:#3a1a17}}
:root[data-theme=dark]{--bg:#0f141c;--card:#171e29;--text:#e8ecf3;--muted:#98a2b3;--line:#2a3342;--accent:#6ea0ff;--accent-soft:#1c2a44;--ok:#5fd38a;--ok-bg:#12301f;--bad:#ff8f84;--bad-bg:#3a1a17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.25rem;margin:0}
button{font:inherit;cursor:pointer}
.icon{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 22px;font-weight:600}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.q{font-size:1.1rem;font-weight:600;margin:6px 0}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.8rem;border-radius:99px;padding:1px 10px;margin-bottom:6px}
.exp{border-radius:12px;padding:14px 16px;margin-top:6px}
.exp.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.exp.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.exp b.h{display:block;margin-bottom:4px}
.exp p{margin:2px 0;white-space:pre-wrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.grid{display:grid;gap:10px;margin:16px 0}
label.opt2{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.score{font-size:3rem;font-weight:700;color:var(--accent);margin:0}
.rev{border-top:1px solid var(--line);padding:10px 0}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.8rem;padding:0}
.dot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.dot.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.dot.cur{outline:2px solid var(--accent)}
.seg{display:flex;gap:8px;margin:10px 0}.segbtn{flex:1;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:600}.segbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📊 ควิซการวิเคราะห์ข้อมูล</h1><button class="icon" id="theme" aria-label="สลับธีม">🌓</button></header>
<main id="app"></main>
</div>
<script>
const SETS=[{"id":1,"name":"ชุดที่ 1","groups":[{"id":1,"name":"บทนำและแนวคิดการวิเคราะห์ข้อมูล"},{"id":2,"name":"การจัดการประมวลผลข้อมูล"},{"id":3,"name":"การสำรวจข้อมูลเบื้องต้น"},{"id":4,"name":"แนวทางการวิเคราะห์ข้อมูล"},{"id":5,"name":"การวิเคราะห์การถดถอย"},{"id":6,"name":"การวิเคราะห์จำแนกประเภท"},{"id":7,"name":"การวิเคราะห์จัดกลุ่ม"},{"id":8,"name":"ระบบแนะนำ"},{"id":9,"name":"การนำเสนอข้อมูลเชิงภาพ"}],"qs":[{"n":1,"g":1,"q":"ข้อใดจัดเป็นคำถามระดับ Predictive Analytics","c":[{"k":"a","t":"เดือนใดของปีที่แล้วมียอดขายสูงสุด"},{"k":"b","t":"ไตรมาสหน้าลูกค้ารายนี้จะกลับมาซื้อซ้ำหรือไม่"},{"k":"c","t":"จำนวนผู้ใช้งานเฉลี่ยต่อวันในไตรมาสที่ผ่านมาเป็นเท่าใด"},{"k":"d","t":"ควรนำเสนอสินค้ากลุ่มใดแก่ลูกค้ารายนี้เพื่อให้เกิดยอดขายสูงสุด"}],"ans":"b","e":"Predictive Analytics ตอบคำถามว่า “อนาคตจะเกิดอะไรขึ้น” โดยใช้ข้อมูลในอดีตสร้างโมเดลพยากรณ์ การที่ลูกค้าจะกลับมาซื้อซ้ำในไตรมาสหน้าหรือไม่ คือการทำนายเหตุการณ์ในอนาคต\n• (a) และ (c) เป็นการสรุปข้อมูลในอดีต = Descriptive\n• (d) ถามว่า “ควรทำอะไร” เพื่อให้ได้ผลลัพธ์ดีที่สุด = Prescriptive"},{"n":2,"g":1,"q":"บุคคลที่มีทักษะการเขียนโปรแกรมและเข้าใจธุรกิจเป็นอย่างดี แต่ขาดพื้นฐานคณิตศาสตร์และสถิติ มีความเสี่ยงต่อสิ่งใดมากที่สุด","c":[{"k":"a","t":"สร้างโมเดลที่ดูแม่นยำในการทดสอบแต่ตีความข้อมูลผิดพลาด"},{"k":"b","t":"ใช้เวลาในการเตรียมข้อมูลนานกว่าปกติหลายเท่า"},{"k":"c","t":"ไม่สามารถนำโมเดลไปติดตั้งใช้งานจริงได้"},{"k":"d","t":"ไม่สามารถสื่อสารผลการวิเคราะห์ให้ผู้บริหารเข้าใจได้อย่างชัดเจน"}],"ans":"a","e":"คนที่เขียนโปรแกรมเก่งแต่ขาดพื้นฐานสถิติ จะรันโมเดลได้ แต่ไม่เข้าใจข้อสมมติ ความเอนเอียง การรั่วไหลของข้อมูล (data leakage) หรือ overfitting จึงอาจได้โมเดลที่คะแนนทดสอบดูดีแต่ตีความผลผิด ซึ่งเป็นความเสี่ยงที่ร้ายแรงที่สุด\n• (b) เวลาเตรียมข้อมูลขึ้นกับทักษะการเขียนโปรแกรม ซึ่งผู้นี้มีอยู่แล้ว\n• (c) การนำโมเดลไปติดตั้งเป็นทักษะด้านโปรแกรมมิ่ง\n• (d) ผู้นี้เข้าใจธุรกิจดี จึงสื่อสารกับผู้บริหารได้"},{"n":3,"g":1,"q":"บุคลากรตำแหน่งใดรับผิดชอบหลักในการจัดหาและเตรียมข้อมูลให้พร้อมใช้งาน","c":[{"k":"a","t":"Data Scientist"},{"k":"b","t":"Data Engineer"},{"k":"c","t":"Business Data Analyst"},{"k":"d","t":"Software Developer"}],"ans":"b","e":"Data Engineer รับผิดชอบสร้างและดูแล data pipeline จัดหา รวบรวม ทำความสะอาด และจัดเก็บข้อมูลให้พร้อมใช้ ส่วน Data Scientist เน้นสร้างโมเดล Business Data Analyst เน้นวิเคราะห์และตีความเพื่อธุรกิจ และ Software Developer เน้นพัฒนาซอฟต์แวร์"},{"n":4,"g":1,"q":"เมื่อเรียงระดับการวิเคราะห์ตามความซับซ้อนจากน้อยไปมาก ข้อใดถูกต้อง","c":[{"k":"a","t":"Predictive, Descriptive, Prescriptive"},{"k":"b","t":"Descriptive, Predictive, Prescriptive"},{"k":"c","t":"Prescriptive, Predictive, Descriptive"},{"k":"d","t":"Descriptive, Prescriptive, Predictive"}],"ans":"b","e":"ความซับซ้อนเรียงจากน้อยไปมาก: Descriptive (เกิดอะไรขึ้น) → Predictive (จะเกิดอะไรขึ้น) → Prescriptive (ควรทำอะไร) เพราะ Prescriptive ต้องอาศัยผลพยากรณ์ก่อนแล้วจึงเสนอทางเลือกที่ดีที่สุด"},{"n":5,"g":1,"q":"ระบบที่เลือกและดำเนินการซื้อขายหลักทรัพย์แทนผู้ใช้โดยอัตโนมัติ จัดอยู่ในผลลัพธ์ประเภทใด","c":[{"k":"a","t":"Descriptive Analytics"},{"k":"b","t":"Decision Support"},{"k":"c","t":"Data Exploration"},{"k":"d","t":"Decision Automation"}],"ans":"d","e":"ระบบที่ตัดสินใจและลงมือทำเองโดยไม่ต้องรอมนุษย์ คือ Decision Automation\n• Decision Support เป็นการช่วยให้มนุษย์ตัดสินใจ แต่มนุษย์ยังเป็นผู้ตัดสินใจ\n• Descriptive Analytics และ Data Exploration เป็นการสรุป/สำรวจข้อมูล ไม่ได้ลงมือทำ"},{"n":6,"g":2,"q":"ข้อมูลคอลัมน์หนึ่งมีค่า Q1 = 20 และ Q3 = 32 ค่าขอบบน (upper bound) ตามวิธี IQR เป็นเท่าใด","c":[{"k":"a","t":"44"},{"k":"b","t":"47"},{"k":"c","t":"50"},{"k":"d","t":"56"}],"ans":"c","e":"วิธี IQR: IQR = Q3 − Q1 = 32 − 20 = 12\nUpper bound = Q3 + 1.5 × IQR = 32 + 1.5 × 12 = 32 + 18 = 50\n(Lower bound = Q1 − 1.5 × IQR = 20 − 18 = 2)"},{"n":7,"g":2,"q":"จากข้อ 6 หากข้อมูลในคอลัมน์คือ [8, 22, 25, 28, 30, 32, 55] ค่าใดถูกระบุว่าเป็น outlier","c":[{"k":"a","t":"8"},{"k":"b","t":"32"},{"k":"c","t":"ทั้ง 8 และ 55"},{"k":"d","t":"55"}],"ans":"d","e":"ข้อนี้ระบุว่า “จากข้อ 6” จึงใช้ขอบเขตจากข้อ 6 คือ ต่ำกว่า 2 หรือสูงกว่า 50 จึงเป็น outlier\n• 8 อยู่ในช่วง [2, 50] จึงไม่ใช่ outlier\n• 55 > 50 จึงเป็น outlier\nดังนั้น outlier คือ 55 เท่านั้น\n(หมายเหตุ: ถ้าคำนวณควอร์ไทล์ใหม่จากข้อมูล 7 ค่า Q1 = 22, Q3 = 32, IQR = 10, ขอบเขต 7–47 ก็ยังได้ 55 เป็น outlier เพียงตัวเดียวเช่นกัน)"},{"n":8,"g":2,"q":"ค่าในคอลัมน์หนึ่งมีค่าเฉลี่ย 40 และส่วนเบี่ยงเบนมาตรฐาน 15 หากใช้ช่วง z-score ที่ยอมรับได้เป็น [-2, 2] ค่า 85 จะถูกพิจารณาอย่างไร","c":[{"k":"a","t":"เป็นค่าผิดปกติ เพราะ z-score เท่ากับ 3.0"},{"k":"b","t":"เป็นค่าปกติ เพราะ z-score เท่ากับ 1.8"},{"k":"c","t":"เป็นค่าปกติ เพราะ z-score เท่ากับ 1.5"},{"k":"d","t":"ไม่สามารถสรุปได้ เพราะต้องทราบจำนวนข้อมูลทั้งหมดก่อนจึงจะคำนวณ z-score ได้"}],"ans":"a","e":"z = (x − mean) / SD = (85 − 40) / 15 = 45 / 15 = 3.0\nเนื่องจาก 3.0 อยู่นอกช่วง [−2, 2] จึงเป็นค่าผิดปกติ\nข้อ (d) ผิด เพราะ z-score ใช้เพียงค่าเฉลี่ยและ SD ซึ่งโจทย์ให้มาแล้ว ไม่จำเป็นต้องทราบจำนวนข้อมูล"},{"n":9,"g":2,"q":"คอลัมน์ \"payment\" มีค่า cash, credit และ transfer ควรใช้เทคนิคใดก่อนนำเข้าเทคนิค Logistic Regression","c":[{"k":"a","t":"One-Hot Encoding"},{"k":"b","t":"Standardization"},{"k":"c","t":"Binning"},{"k":"d","t":"การเข้ารหัสตามลำดับเป็น 0, 1 และ 2 ตามลำดับที่ปรากฏในชุดข้อมูล"}],"ans":"a","e":"payment เป็นข้อมูลเชิงกลุ่มแบบ nominal (ไม่มีลำดับ) ต้องแปลงเป็นตัวเลขก่อนใช้กับ Logistic Regression ด้วย One-Hot Encoding แยกเป็นคอลัมน์ 0/1 ต่อหนึ่งกลุ่ม\n• (d) การกำหนด 0,1,2 ทำให้โมเดลเข้าใจว่า transfer > credit > cash ซึ่งไม่จริง\n• (b) Standardization ใช้กับข้อมูลเชิงปริมาณ\n• (c) Binning ใช้แบ่งช่วงค่าตัวเลข"},{"n":10,"g":2,"q":"คำสั่ง Pandas ใดใช้แสดงเฉพาะแถวที่ salary มากกว่า 50000 และ age น้อยกว่า 30","c":[{"k":"a","t":"df[(df[\"salary\"]>50000) & (df[\"age\"]\u003c30)]"},{"k":"b","t":"df[df[\"salary\"]>50000 and df[\"age\"]\u003c30]"},{"k":"c","t":"df[(df[\"salary\"]>50000) | (df[\"age\"]\u003c30)]"},{"k":"d","t":"df.filter(salary=\">50000\", age=\"\u003c30\")"}],"ans":"a","e":"ใน Pandas การกรองด้วยหลายเงื่อนไขต้องใช้ตัวดำเนินการระดับบิต & (และ) และ | (หรือ) โดยครอบแต่ละเงื่อนไขด้วยวงเล็บ\n• (b) ใช้ and ไม่ได้กับ Series จะเกิด ValueError\n• (c) ใช้ | หมายถึง “หรือ” ไม่ตรงกับโจทย์\n• (d) df.filter() ไม่ได้ใช้กรองแถวตามเงื่อนไขแบบนี้"},{"n":11,"g":3,"q":"ข้อมูล [3, 7, 8, 12, 15, 20] มีค่ามัธยฐาน (median) เท่าใด","c":[{"k":"a","t":"8.0"},{"k":"b","t":"9.5"},{"k":"c","t":"10.0"},{"k":"d","t":"12.0"}],"ans":"c","e":"ข้อมูลมี 6 ค่า (เรียงแล้ว) มัธยฐานคือค่าเฉลี่ยของตำแหน่งที่ 3 และ 4 = (8 + 12) / 2 = 10.0"},{"n":12,"g":3,"q":"ข้อมูล [1, 2, 3, 4, 5] มีค่าส่วนเบี่ยงเบนมาตรฐานใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"1.00"},{"k":"b","t":"1.41"},{"k":"c","t":"1.58"},{"k":"d","t":"2.00"}],"ans":"c","e":"ค่าเฉลี่ย = 3, ผลรวมกำลังสองของส่วนเบี่ยงเบน = 4+1+0+1+4 = 10\n• SD ตัวอย่าง (n−1) = √(10/4) = √2.5 ≈ 1.58 ← ค่าเริ่มต้นของ Pandas (.std())\n• SD ประชากร (n) = √(10/5) = √2 ≈ 1.41\nเนื่องจากรายวิชาใช้ Pandas ซึ่งคำนวณแบบตัวอย่างเป็นค่าเริ่มต้น จึงตอบ 1.58 (ถ้าอาจารย์ใช้สูตรประชากร คำตอบจะเป็น (b) 1.41 ควรตรวจสอบกับสูตรที่ใช้ในชั้นเรียน)"},{"n":13,"g":3,"q":"ค่า Pearson Correlation ระหว่างฟีเจอร์ A กับค่าเป้าหมายเท่ากับ 0.05 ควรตีความอย่างไร","c":[{"k":"a","t":"ฟีเจอร์ A มีความสัมพันธ์เชิงเส้นในทิศทางเดียวกันอย่างชัดเจน"},{"k":"b","t":"ฟีเจอร์ A แทบไม่มีความสัมพันธ์เชิงเส้นกับค่าเป้าหมาย"},{"k":"c","t":"ฟีเจอร์ A มีความสัมพันธ์เชิงเส้นในทิศทางตรงกันข้ามอย่างชัดเจน"},{"k":"d","t":"ฟีเจอร์ A เป็นสาเหตุที่ทำให้ค่าเป้าหมายเปลี่ยนแปลงในอัตราร้อยละ 5"}],"ans":"b","e":"Pearson r มีค่า −1 ถึง +1 ค่าใกล้ 0 หมายถึงแทบไม่มีความสัมพันธ์เชิงเส้น 0.05 จึงใกล้ศูนย์มาก\n• (a)/(c) ต้องมี |r| สูง\n• (d) ผิดสองประการ: สหสัมพันธ์ไม่ได้บอกความเป็นสาเหตุ และ 0.05 ไม่ได้แปลว่าเปลี่ยนแปลงร้อยละ 5"},{"n":14,"g":3,"q":"ใน Box Plot เส้นภายในกล่องแสดงค่าใด","c":[{"k":"a","t":"ค่าเฉลี่ย"},{"k":"b","t":"มัธยฐาน"},{"k":"c","t":"ควอไทล์ที่หนึ่ง"},{"k":"d","t":"ค่าสูงสุดที่ไม่นับรวมค่าผิดปกติในชุดข้อมูล"}],"ans":"b","e":"Box Plot: เส้นในกล่องคือมัธยฐาน (Q2) ขอบล่างและขอบบนของกล่องคือ Q1 และ Q3 และหนวด (whisker) แสดงค่าต่ำสุด/สูงสุดที่ไม่ใช่ outlier"},{"n":15,"g":3,"q":"หากต้องการสำรวจว่าฟีเจอร์ใดมีความสัมพันธ์เชิงเส้นกับค่าเป้าหมายมากที่สุด ควรใช้วิธีใด","c":[{"k":"a","t":"พล็อต histogram ของทุกฟีเจอร์"},{"k":"b","t":"พล็อต box plot ของทุกฟีเจอร์พร้อมกัน"},{"k":"c","t":"หาค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐานของทุกฟีเจอร์แล้วนำมาเปรียบเทียบกัน"},{"k":"d","t":"คำนวณค่าสหสัมพันธ์ของทุกฟีเจอร์เทียบกับค่าเป้าหมาย"}],"ans":"d","e":"ค่าสหสัมพันธ์ (Pearson correlation) วัดความสัมพันธ์เชิงเส้นระหว่างแต่ละฟีเจอร์กับค่าเป้าหมายโดยตรง จึงใช้จัดอันดับได้\n• Histogram และ Box plot ดูการกระจายของแต่ละฟีเจอร์ ไม่ได้เทียบกับเป้าหมาย\n• ค่าเฉลี่ยและ SD บอกลักษณะของตัวแปรเดียว ไม่ได้บอกความสัมพันธ์"},{"n":16,"g":4,"q":"สมการ f(x) = 3 + 2x จัดเป็นอะไร","c":[{"k":"a","t":"อัลกอริทึมสำหรับหาค่าสัมประสิทธิ์"},{"k":"b","t":"โมเดลที่พร้อมนำไปคำนวณผลลัพธ์"},{"k":"c","t":"โครงสร้างสมการที่ยังใช้งานจริงไม่ได้"},{"k":"d","t":"ฟังก์ชันการสูญเสียที่ใช้ในกระบวนการเรียนรู้ของโมเดล"}],"ans":"b","e":"f(x) = 3 + 2x มีค่าสัมประสิทธิ์กำหนดครบแล้ว (3 และ 2) แทนค่า x ได้ผลลัพธ์ทันที จึงเป็นโมเดลที่พร้อมใช้งาน\nถ้ามีเพียงโครงสร้าง y = b0 + b1x ที่ยังไม่รู้ค่า b จึงจะเป็นโครงสร้างสมการที่ยังใช้ไม่ได้ ส่วนอัลกอริทึมคือวิธีหาค่าสัมประสิทธิ์ และ loss function คือตัววัดความคลาดเคลื่อน"},{"n":17,"g":4,"q":"โจทย์ \"พยากรณ์จำนวนผู้โดยสารที่จะใช้บริการรถไฟฟ้าในวันพรุ่งนี้\" จัดเป็นการวิเคราะห์แบบใด","c":[{"k":"a","t":"Regression Analysis"},{"k":"b","t":"Classification Analysis"},{"k":"c","t":"Cluster Analysis"},{"k":"d","t":"Prescriptive Analytics"}],"ans":"a","e":"ต้องการพยากรณ์ “จำนวน” ผู้โดยสาร ซึ่งเป็นค่าต่อเนื่องเชิงตัวเลข จึงเป็น Regression\n• Classification ทำนายประเภท/กลุ่ม\n• Cluster Analysis จัดกลุ่มโดยไม่มีค่าเป้าหมาย\n• Prescriptive เสนอแนะการกระทำ"},{"n":18,"g":4,"q":"หลังเสร็จสิ้นการทดสอบด้วย 4-Fold Cross-Validation ควรดำเนินการอย่างไรต่อ","c":[{"k":"a","t":"เลือกโมเดลจากรอบที่ให้ค่าประสิทธิภาพสูงสุดไปใช้งานจริง"},{"k":"b","t":"เลือกโมเดลจากรอบสุดท้ายไปใช้งานจริงเนื่องจากเรียนรู้ข้อมูลมากที่สุด"},{"k":"c","t":"นำโมเดลทั้งสี่รอบมาเฉลี่ยค่าสัมประสิทธิ์เข้าด้วยกันเป็นโมเดลสำหรับใช้งานจริง"},{"k":"d","t":"นำเทคนิคที่เลือกไปเรียนรู้ข้อมูลทั้งหมดเพื่อสร้างโมเดลใช้งานจริง"}],"ans":"d","e":"K-Fold CV ใช้ประเมินและเลือกเทคนิค/ค่าพารามิเตอร์ ไม่ใช่การสร้างโมเดลสุดท้าย เมื่อเลือกเทคนิคได้แล้ว ให้นำเทคนิคนั้นไปเรียนรู้จากข้อมูลทั้งหมดเพื่อสร้างโมเดลใช้งานจริง\n• (a)/(b) แต่ละรอบใช้ข้อมูลเพียงบางส่วน\n• (c) การเฉลี่ยสัมประสิทธิ์ของโมเดลแต่ละรอบไม่ใช่วิธีมาตรฐานและใช้ไม่ได้กับทุกโมเดล"},{"n":19,"g":4,"q":"ในกระบวนการสร้างโมเดล ขั้นตอนใดต้องกระทำก่อนการแปลงรูปข้อมูลบางฟีเจอร์เสมอ","c":[{"k":"a","t":"การเลือกเทคนิคการวิเคราะห์ที่จะใช้สร้างโมเดล"},{"k":"b","t":"การวัดผลการทดสอบด้วยตัวชี้วัดที่เหมาะสม"},{"k":"c","t":"การแบ่งชุดข้อมูลสำหรับสร้างและทดสอบโมเดล"},{"k":"d","t":"การกำหนดค่าอาร์กิวเมนต์ให้กับพารามิเตอร์ของเทคนิคที่เลือกใช้"}],"ans":"c","e":"ต้องแบ่งข้อมูลเป็นชุดสร้างโมเดล (train) และชุดทดสอบ (test) ก่อน แล้วจึงเรียนรู้พารามิเตอร์ของการแปลง (เช่น mean/SD, ตัวเข้ารหัส) จากชุด train เท่านั้น เพื่อป้องกัน data leakage\n• (a), (b), (d) เป็นขั้นตอนที่เกิดหลังหรือเกิดคู่กับการแปลงข้อมูล ไม่ใช่สิ่งที่ “ต้อง” ทำก่อนเสมอ"},{"n":20,"g":5,"q":"จากค่าจริง y = [10, 20, 30] และค่าพยากรณ์ y-hat = [12, 18, 33] ค่า MAE เป็นเท่าใด","c":[{"k":"a","t":"2.33"},{"k":"b","t":"2.00"},{"k":"c","t":"2.38"},{"k":"d","t":"5.67"}],"ans":"a","e":"|ผิดพลาด| = |10−12| = 2, |20−18| = 2, |30−33| = 3\nMAE = (2 + 2 + 3) / 3 = 7/3 ≈ 2.33"},{"n":21,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า MSE เป็นเท่าใด","c":[{"k":"a","t":"2.33"},{"k":"b","t":"2.38"},{"k":"c","t":"4.50"},{"k":"d","t":"5.67"}],"ans":"d","e":"ความคลาดเคลื่อนยกกำลังสอง = 4, 4, 9\nMSE = (4 + 4 + 9) / 3 = 17/3 ≈ 5.67"},{"n":22,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า RMSE มีค่าใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"2.00"},{"k":"b","t":"2.38"},{"k":"c","t":"2.33"},{"k":"d","t":"3.00"}],"ans":"b","e":"RMSE = √MSE = √5.667 ≈ 2.38"},{"n":23,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า MAPE มีค่าใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"ร้อยละ 13.3"},{"k":"b","t":"ร้อยละ 11.7"},{"k":"c","t":"ร้อยละ 10.0"},{"k":"d","t":"ร้อยละ 20.0"}],"ans":"a","e":"MAPE = (1/n) Σ |y − ŷ| / |y| × 100\n= (1/3) × (2/10 + 2/20 + 3/30) × 100 = (1/3)(0.2 + 0.1 + 0.1) × 100 = 0.4/3 × 100 ≈ 13.3%"},{"n":24,"g":5,"q":"จากโมเดล y-hat = 15.2 + 3.4(x1) - 1.8(x2) หากค่า x2 เพิ่มขึ้น 2 หน่วยโดยที่ x1 คงที่ ค่า y-hat จะเปลี่ยนแปลงอย่างไร","c":[{"k":"a","t":"ลดลง 1.8 หน่วย"},{"k":"b","t":"เพิ่มขึ้น 3.6 หน่วย"},{"k":"c","t":"ลดลง 3.6 หน่วย"},{"k":"d","t":"ไม่สามารถระบุได้"}],"ans":"c","e":"สัมประสิทธิ์ของ x2 คือ −1.8 เมื่อ x2 เพิ่ม 2 หน่วย (x1 คงที่) ŷ เปลี่ยน = −1.8 × 2 = −3.6 คือลดลง 3.6 หน่วย"},{"n":25,"g":5,"q":"กำหนดให้ X = [[1, 2, 1], [1, 3, 2]] และ theta = [1, 2, 3] ค่า y-hat ของแถวแรกเป็นเท่าใด","c":[{"k":"a","t":"6"},{"k":"b","t":"7"},{"k":"c","t":"8"},{"k":"d","t":"13"}],"ans":"c","e":"ŷ = X·θ แถวแรก [1, 2, 1] · [1, 2, 3] = 1×1 + 2×2 + 1×3 = 1 + 4 + 3 = 8"},{"n":26,"g":5,"q":"ในเทคนิค Gradient Descent ค่า Learning Rate ที่น้อยเกินไปจะส่งผลอย่างไร","c":[{"k":"a","t":"การปรับค่าในแต่ละรอบอาจก้าวข้ามจุดที่เหมาะสม"},{"k":"b","t":"ค่าสัมประสิทธิ์จะไม่เปลี่ยนแปลงเลยตลอดกระบวนการ"},{"k":"c","t":"ต้องใช้จำนวนรอบมากขึ้นกว่าจะได้ค่าที่เหมาะสม"},{"k":"d","t":"ค่าความคลาดเคลื่อนจะเพิ่มขึ้นเรื่อย ๆ จนกระบวนการเรียนรู้ล้มเหลว"}],"ans":"c","e":"Learning rate น้อยเกินไปทำให้ก้าวปรับค่าเล็กมาก จึงลู่เข้าสู่ค่าที่เหมาะสมช้า ต้องใช้จำนวนรอบมากขึ้น\n• (a) และ (d) เป็นอาการของ learning rate ที่มากเกินไป (ก้าวข้ามจุดต่ำสุด/ลู่ออก)\n• (b) ค่ายังเปลี่ยนแปลงอยู่ เพียงเปลี่ยนช้า"},{"n":27,"g":6,"q":"ระบบตรวจจับอีเมลขยะทำนายว่าอีเมลฉบับหนึ่งไม่ใช่อีเมลขยะ แต่ความจริงเป็นอีเมลขยะ กรณีนี้จัดเป็นอะไร","c":[{"k":"a","t":"True-Positive"},{"k":"b","t":"True-Negative"},{"k":"c","t":"False-Positive"},{"k":"d","t":"False-Negative"}],"ans":"d","e":"ระบบทำนาย “ไม่ใช่ขยะ” (Negative) แต่ความจริงเป็น “ขยะ” (Positive) = ทำนายลบแต่จริงเป็นบวก จึงเป็น False-Negative (พลาดการจับ)"},{"n":28,"g":6,"q":"จากเมทริกซ์คอนฟิวชัน TP = 30, TN = 40, FP = 10, FN = 20 ค่า Accuracy เป็นเท่าใด","c":[{"k":"a","t":"0.60"},{"k":"b","t":"0.70"},{"k":"c","t":"0.65"},{"k":"d","t":"0.75"}],"ans":"b","e":"Accuracy = (TP + TN) / (TP + TN + FP + FN) = (30 + 40) / (30 + 40 + 10 + 20) = 70/100 = 0.70"},{"n":29,"g":6,"q":"ชุดข้อมูลตรวจจับการทุจริตมี 1,000 รายการ เป็นรายการทุจริตเพียง 20 รายการ หากโมเดลทำนายว่าทุกรายการไม่ทุจริต จะเกิดปัญหาใดกับการวัดผลด้วย Accuracy","c":[{"k":"a","t":"ค่า Accuracy จะต่ำมากจนไม่สามารถตีความได้"},{"k":"b","t":"ค่า Accuracy จะสูงมากทั้งที่โมเดลไม่มีประโยชน์"},{"k":"c","t":"ค่า Accuracy จะเท่ากับศูนย์เนื่องจากไม่มีการทำนายคลาสบวก"},{"k":"d","t":"ค่า Accuracy จะคำนวณไม่ได้เนื่องจากตัวส่วนของสมการมีค่าเป็นศูนย์"}],"ans":"b","e":"ถ้าทำนายว่าไม่ทุจริตทั้งหมด จะถูก 980 จาก 1,000 รายการ Accuracy = 98% ทั้งที่โมเดลจับการทุจริตไม่ได้เลย (Recall = 0) นี่คือปัญหาของข้อมูลไม่สมดุล (imbalanced data) ที่ควรใช้ Precision, Recall, F1 ประกอบ"},{"n":30,"g":6,"q":"หากแบ่งข้อมูลได้ 8 ตัวอย่าง เป็นคลาส A จำนวน 6 ตัวอย่าง และคลาส B จำนวน 2 ตัวอย่าง ค่า GINI เป็นเท่าใด","c":[{"k":"a","t":"0.250"},{"k":"b","t":"0.375"},{"k":"c","t":"0.320"},{"k":"d","t":"0.500"}],"ans":"b","e":"Gini = 1 − Σ pᵢ² โดย p(A) = 6/8 = 0.75, p(B) = 2/8 = 0.25\nGini = 1 − (0.5625 + 0.0625) = 1 − 0.625 = 0.375"},{"n":31,"g":6,"q":"ในสมการ Logistic Regression P = 1 / (1 + e^-(b0 + BX)) หากค่าในวงเล็บเท่ากับ 0 ค่า P จะเป็นเท่าใด","c":[{"k":"a","t":"0.00"},{"k":"b","t":"0.25"},{"k":"c","t":"1.00"},{"k":"d","t":"0.50"}],"ans":"d","e":"P = 1/(1 + e^−0) = 1/(1 + 1) = 0.50 (จุดตัดสินใจของ sigmoid)"},{"n":32,"g":7,"q":"ข้อมูลหนึ่งมิติ [1, 2, 6, 7, 8] ใช้ K-Means โดย K = 2 เริ่มต้นจุดศูนย์กลางที่ตำแหน่ง 1 และ 5 หลังรอบแรกจุดศูนย์กลางฝั่งขวาจะอยู่ที่ตำแหน่งใด","c":[{"k":"a","t":"5.0"},{"k":"b","t":"7.0"},{"k":"c","t":"6.5"},{"k":"d","t":"8.0"}],"ans":"b","e":"จุดศูนย์กลางเริ่มต้น c1 = 1, c2 = 5\nจัดกลุ่ม: 1 → c1; 2 → c1 (ห่าง 1 เทียบกับ 3); 6, 7, 8 → c2\nคำนวณจุดศูนย์กลางใหม่ของกลุ่มขวา = (6 + 7 + 8)/3 = 7.0 (กลุ่มซ้าย = (1+2)/2 = 1.5)"},{"n":33,"g":7,"q":"จากข้อ 32 เมื่อกระบวนการเสร็จสิ้น สมาชิกของกลุ่มที่มีจุดศูนย์กลางค่าน้อยกว่าคือข้อใด","c":[{"k":"a","t":"{1, 2}"},{"k":"b","t":"{1, 2, 6}"},{"k":"c","t":"{6, 7, 8}"},{"k":"d","t":"{1, 2, 6, 7, 8}"}],"ans":"a","e":"รอบถัดไปใช้ c1 = 1.5, c2 = 7 : จุด 6 ห่างจาก c1 = 4.5 และห่างจาก c2 = 1 จึงยังอยู่กลุ่มขวา การจัดกลุ่มไม่เปลี่ยน จึงลู่เข้า\nกลุ่มที่มีจุดศูนย์กลางน้อยกว่า (1.5) คือ {1, 2}"},{"n":34,"g":7,"q":"กำหนดข้อมูลหนึ่งมิติ P = {2, 3, 4, 5, 12, 13, 30} ใช้ DBSCAN โดย eps = 1.5 และ min_samples = 3 (นับตัวเองด้วย) จุดใดเป็น core point","c":[{"k":"a","t":"3 และ 4"},{"k":"b","t":"12 และ 13"},{"k":"c","t":"2 และ 5"},{"k":"d","t":"2, 3, 4 และ 5"}],"ans":"a","e":"Core point คือจุดที่มีเพื่อนบ้านภายในรัศมี eps = 1.5 (รวมตัวเอง) ≥ 3 จุด\n• 2: {2, 3} = 2 ✗\n• 3: {2, 3, 4} = 3 ✓\n• 4: {3, 4, 5} = 3 ✓\n• 5: {4, 5} = 2 ✗\n• 12: {12, 13} = 2 ✗, 13: {12, 13} = 2 ✗, 30: {30} = 1 ✗\nดังนั้น core point คือ 3 และ 4"},{"n":35,"g":7,"q":"จากข้อ 34 จำนวน noise point เป็นเท่าใด","c":[{"k":"a","t":"3 จุด"},{"k":"b","t":"2 จุด"},{"k":"c","t":"1 จุด"},{"k":"d","t":"4 จุด"}],"ans":"a","e":"จุด 2 และ 5 เป็น border point (ไม่ใช่ core แต่อยู่ในรัศมีของ core 3 และ 4)\nจุด 12, 13 และ 30 ไม่เป็น core และไม่อยู่ในรัศมีของ core ใดเลย จึงเป็น noise = 3 จุด"},{"n":36,"g":7,"q":"เหตุใดจึงไม่สามารถใช้ค่า Accuracy วัดผลการทำ Cluster Analysis ได้","c":[{"k":"a","t":"เพราะจำนวนกลุ่มที่ได้มักไม่เท่ากับจำนวนกลุ่มที่คาดหวังไว้"},{"k":"b","t":"เพราะไม่มีค่าคลาสจริงไว้ใช้เปรียบเทียบกับผลการจัดกลุ่ม"},{"k":"c","t":"เพราะสมาชิกในแต่ละกลุ่มมีจำนวนไม่เท่ากันจึงเกิดสภาวะไม่สมดุล"},{"k":"d","t":"เพราะผลการจัดกลุ่มเปลี่ยนแปลงทุกครั้งที่รันจากการสุ่มค่าเริ่มต้น"}],"ans":"b","e":"Accuracy ต้องเทียบคำตอบที่ทำนายกับค่าคลาสจริง แต่ Cluster Analysis เป็น unsupervised learning ไม่มีคลาสจริงให้เปรียบเทียบ จึงต้องใช้ตัวชี้วัดอื่น เช่น Silhouette, SSE/Inertia"},{"n":37,"g":8,"q":"รายการแนะนำเรียงคะแนนจากมากไปน้อย 8 รายการ โดยมี test item อยู่ในลำดับที่ 1 และ 4 หากกำหนด K = 5 ค่า Top-K Precision เป็นเท่าใด","c":[{"k":"a","t":"0.25"},{"k":"b","t":"0.33"},{"k":"c","t":"0.50"},{"k":"d","t":"0.40"}],"ans":"d","e":"Top-K Precision = จำนวน test item ที่อยู่ใน K อันดับแรก / K\nTest item อยู่อันดับ 1 และ 4 ซึ่งอยู่ใน top 5 ทั้งคู่ = 2 รายการ\nPrecision@5 = 2/5 = 0.40"},{"n":38,"g":8,"q":"จากข้อ 37 ค่า hit@5 เป็นเท่าใด","c":[{"k":"a","t":"1"},{"k":"b","t":"0.4"},{"k":"c","t":"0"},{"k":"d","t":"2"}],"ans":"a","e":"hit@K = 1 ถ้ามี test item อย่างน้อยหนึ่งรายการอยู่ใน top K มิฉะนั้นเป็น 0 เนื่องจากมี test item อยู่อันดับ 1 และ 4 ใน top 5 จึงได้ hit@5 = 1 (ไม่ใช่จำนวนที่พบ)"},{"n":39,"g":8,"q":"ในการหาค่า AUC ของระบบแนะนำ หากมีการเปรียบเทียบทั้งหมด 10 คู่ โดยชนะ 8 คู่ และเสมอ 2 คู่ ค่า AUC เป็นเท่าใด","c":[{"k":"a","t":"0.80"},{"k":"b","t":"0.85"},{"k":"c","t":"1.00"},{"k":"d","t":"0.90"}],"ans":"d","e":"AUC = (จำนวนคู่ที่ชนะ + 0.5 × จำนวนคู่ที่เสมอ) / จำนวนคู่ทั้งหมด = (8 + 0.5×2)/10 = 9/10 = 0.90"},{"n":40,"g":8,"q":"ระบบแนะนำสินค้าที่เพิ่งเปิดตัวและยังไม่มีประวัติการซื้อของผู้ใช้ ควรเริ่มต้นด้วยแนวทางใด","c":[{"k":"a","t":"Collaborative Filtering เนื่องจากให้ผลแม่นยำที่สุด"},{"k":"b","t":"Community Detection เพื่อจัดกลุ่มผู้ใช้ที่มีพฤติกรรมคล้ายกันก่อนการแนะนำ"},{"k":"c","t":"Matrix Factorization เนื่องจากรองรับข้อมูลขนาดใหญ่ได้ดี"},{"k":"d","t":"Recommend by Product Features หรือ Knowledge Base"}],"ans":"d","e":"สินค้าที่เพิ่งเปิดตัวไม่มีประวัติผู้ใช้ (Cold start) วิธีที่อิงพฤติกรรมผู้ใช้ เช่น Collaborative Filtering, Matrix Factorization และ Community Detection จึงใช้ไม่ได้ผล ควรเริ่มจากการแนะนำด้วยคุณสมบัติสินค้า (content-based) หรือ Knowledge Base"},{"n":41,"g":9,"q":"ในการแสดงยอดขายรายเดือนตลอดทั้งปี องค์ประกอบภาพใดเหมาะสมที่สุด","c":[{"k":"a","t":"เฉดสีที่แตกต่างกันในแต่ละเดือน"},{"k":"b","t":"ความสว่างของสีที่ไล่ระดับตามยอดขาย"},{"k":"c","t":"ตำแหน่งของจุดบนแผนภูมิเส้น"},{"k":"d","t":"ขนาดพื้นที่ของวงกลมที่แปรผันตามยอดขายในแต่ละเดือน"}],"ans":"c","e":"ข้อมูลเชิงปริมาณเรียงตามเวลา แสดงแนวโน้มได้ดีที่สุดด้วยตำแหน่ง (จุดบนแผนภูมิเส้น) เพราะมนุษย์รับรู้และเปรียบเทียบตำแหน่งได้แม่นยำที่สุด\n• เฉดสีไม่มีลำดับ • ความสว่างแยกได้ไม่กี่ระดับ • ขนาดพื้นที่วงกลมเปรียบเทียบได้ไม่แม่นยำ"},{"n":42,"g":9, ยอนาคต = Predictive\n• การลดราคาเท่าไรเพื่อให้กำไรสูงสุด เป็นการแนะนำการกระทำ = Prescriptive"},{"n":2,"g":1,"q":"ระบบวิเคราะห์ข้อมูลเสนอทางเลือกพร้อมผลลัพธ์ที่คาดการณ์ของแต่ละทางเลือกให้ผู้บริหาร แล้วให้ผู้บริหารเป็นผู้ตัดสินใจเลือกเอง ผลลัพธ์นี้จัดอยู่ในประเภทใด","c":[{"k":"a","t":"Decision Support"},{"k":"b","t":"Decision Automation"},{"k":"c","t":"Data Exploration"},{"k":"d","t":"Descriptive Analytics"}],"ans":"a","e":"Decision Support คือการสนับสนุนให้มนุษย์ตัดสินใจได้ดีขึ้น โดยมนุษย์ยังเป็นผู้ตัดสินใจและลงมือทำ\n• Decision Automation ระบบตัดสินใจและดำเนินการเองโดยไม่ต้องรอมนุษย์\n• Data Exploration คือการสำรวจข้อมูลเพื่อทำความเข้าใจ ไม่ได้เสนอทางเลือกเพื่อการตัดสินใจ\n• Descriptive Analytics เป็นการสรุปข้อมูลในอดีต"},{"n":3,"g":1,"q":"บุคลากรตำแหน่งใดรับผิดชอบหลักในการสร้างโมเดลพยากรณ์และประเมินประสิทธิภาพของโมเดล","c":[{"k":"a","t":"Data Engineer"},{"k":"b","t":"Database Administrator"},{"k":"c","t":"UX Designer"},{"k":"d","t":"Data Scientist"}],"ans":"d","e":"Data Scientist ใช้ความรู้สถิติ การเขียนโปรแกรม และความเข้าใจธุรกิจ เพื่อสร้างโมเดลและประเมินผล\n• Data Engineer ดูแลการจัดหา เตรียม และจัดเก็บข้อมูลให้พร้อมใช้\n• Database Administrator ดูแลระบบฐานข้อมูล ความปลอดภัย และประสิทธิภาพ\n• UX Designer ออกแบบประสบการณ์ผู้ใช้"},{"n":4,"g":1,"q":"บุคคลที่มีความรู้สถิติและเข้าใจธุรกิจเป็นอย่างดี แต่เขียนโปรแกรมไม่เป็น มีความเสี่ยงสำคัญที่สุดต่อสิ่งใด","c":[{"k":"a","t":"เลือกใช้สูตรทางสถิติผิดพลาดบ่อย"},{"k":"b","t":"ไม่เข้าใจโจทย์ปัญหาทางธุรกิจที่ต้องการแก้"},{"k":"c","t":"ไม่สามารถจัดการข้อมูลและสร้างโมเดลด้วยตนเองได้อย่างมีประสิทธิภาพ"},{"k":"d","t":"ไม่สามารถตั้งคำถามที่เหมาะสมกับธุรกิจได้"}],"ans":"c","e":"งานวิเคราะห์ข้อมูลจริงต้องใช้โปรแกรมมิ่งในการดึง ทำความสะอาด ประมวลผลข้อมูลปริมาณมาก และสร้างโมเดล คนที่ไม่เขียนโปรแกรมจึงติดขัดตรงจุดนี้\nตัวเลือกที่เหลือขัดกับโจทย์ เพราะผู้นี้มีความรู้สถิติและเข้าใจธุรกิจดีอยู่แล้ว"},{"n":5,"g":1,"q":"ข้อใดเป็นตัวอย่างของ Prescriptive Analytics","c":[{"k":"a","t":"รายงานยอดขายรวมแยกรายเดือน"},{"k":"b","t":"ระบบแนะนำราคาขายที่ควรตั้งเพื่อให้ได้กำไรสูงสุด"},{"k":"c","t":"ระบบพยากรณ์ยอดขายของไตรมาสหน้า"},{"k":"d","t":"กราฟแสดงค่าเฉลี่ยรายได้ต่อลูกค้า"}],"ans":"b","e":"Prescriptive Analytics ตอบคำถามว่า “ควรทำอะไร” โดยแนะนำการกระทำที่ดีที่สุดเพื่อบรรลุเป้าหมาย การแนะนำราคาที่ให้กำไรสูงสุดจึงเข้าลักษณะนี้\n• รายงานยอดขายและกราฟค่าเฉลี่ย = Descriptive\n• พยากรณ์ยอดขายไตรมาสหน้า = Predictive"},{"n":6,"g":2,"q":"ข้อมูลคอลัมน์หนึ่งมีค่า Q1 = 40 และ Q3 = 60 ค่าขอบบน (upper bound) ตามวิธี IQR เป็นเท่าใด","c":[{"k":"a","t":"80"},{"k":"b","t":"90"},{"k":"c","t":"100"},{"k":"d","t":"120"}],"ans":"b","e":"IQR = Q3 − Q1 = 60 − 40 = 20\nUpper bound = Q3 + 1.5 × IQR = 60 + 1.5 × 20 = 60 + 30 = 90\n(Lower bound = Q1 − 1.5 × IQR = 40 − 30 = 10)"},{"n":7,"g":2,"q":"จากข้อ 6 หากข้อมูลในคอลัมน์คือ [5, 35, 48, 55, 62, 70, 95] ค่าใดถูกระบุว่าเป็น outlier","c":[{"k":"a","t":"95 เท่านั้น"},{"k":"b","t":"5 เท่านั้น"},{"k":"c","t":"ทั้ง 5 และ 95"},{"k":"d","t":"ไม่มีค่าใดเป็น outlier"}],"ans":"c","e":"ขอบเขตจากข้อ 6 คือ [10, 90]\n• 5 \u003c 10 จึงเป็น outlier\n• 95 > 90 จึงเป็น outlier\n• 35, 48, 55, 62, 70 อยู่ในช่วง [10, 90] จึงเป็นค่าปกติ\nดังนั้น outlier คือ 5 และ 95"},{"n":8,"g":2,"q":"ค่าในคอลัมน์หนึ่งมีค่าเฉลี่ย 70 และส่วนเบี่ยงเบนมาตรฐาน 8 หากใช้ช่วง z-score ที่ยอมรับได้เป็น [−2, 2] ค่า 50 จะถูกพิจารณาอย่างไร","c":[{"k":"a","t":"เป็นค่าปกติ เพราะ z-score เท่ากับ −2.5 ซึ่งอยู่ในช่วงที่ยอมรับ"},{"k":"b","t":"เป็นค่าผิดปกติ เพราะ z-score เท่ากับ −2.5"},{"k":"c","t":"เป็นค่าผิดปกติ เพราะ z-score เท่ากับ 2.5"},{"k":"d","t":"เป็นค่าปกติ เพราะ z-score เท่ากับ −1.25"}],"ans":"b","e":"z = (x − mean) / SD = (50 − 70) / 8 = −20 / 8 = −2.5\nเนื่องจาก −2.5 \u003c −2 อยู่นอกช่วง [−2, 2] จึงเป็นค่าผิดปกติ\nสังเกตว่าค่า 50 น้อยกว่าค่าเฉลี่ย z-score จึงติดลบ ไม่ใช่ +2.5"},{"n":9,"g":2,"q":"ใช้ K-Means กับข้อมูลที่มีฟีเจอร์ “รายได้” (หลักหมื่นบาท) และ “อายุ” (หลักสิบปี) ควรทำสิ่งใดก่อนนำเข้าเทคนิค","c":[{"k":"a","t":"One-Hot Encoding เพื่อแปลงฟีเจอร์เป็นคอลัมน์ 0/1"},{"k":"b","t":"Standardization เพื่อปรับฟีเจอร์ให้อยู่ในสเกลใกล้เคียงกัน"},{"k":"c","t":"ตัดฟีเจอร์รายได้ทิ้งเพราะมีค่ามากเกินไป"},{"k":"d","t":"เรียงข้อมูลจากน้อยไปมากทีละคอลัมน์"}],"ans":"b","e":"K-Means ใช้ระยะทางระหว่างจุด ฟีเจอร์ที่ค่ามากอย่างรายได้จะครอบงำระยะทาง ทำให้อายุแทบไม่มีผล จึงต้องทำ Standardization (หรือ Normalization) ให้อยู่ในสเกลใกล้กันก่อน\n• One-Hot Encoding ใช้กับข้อมูลเชิงกลุ่ม ซึ่งสองฟีเจอร์นี้เป็นตัวเลข\n• การตัดฟีเจอร์ทิ้งทำให้เสียข้อมูลโดยไม่จำเป็น\n• การเรียงข้อมูลแยกคอลัมน์ทำให้ความสัมพันธ์ระหว่างฟีเจอร์ของแต่ละแถวเสียหาย"},{"n":10,"g":2,"q":"คำสั่ง Pandas ใดใช้นับจำนวนค่าว่าง (missing value) ในแต่ละคอลัมน์ของ DataFrame ชื่อ df","c":[{"k":"a","t":"df.isnull().sum()"},{"k":"b","t":"df.isnull().count()"},{"k":"c","t":"df.dropna().sum()"},{"k":"d","t":"df.fillna().sum()"}],"ans":"a","e":"df.isnull() ให้ DataFrame ของ True/False (True = ค่าว่าง) แล้ว .sum() จะรวมค่า True แยกตามคอลัมน์ จึงได้จำนวนค่าว่างต่อคอลัมน์\n• .count() นับแถวที่ไม่ใช่ NaN ของค่าบูลีน ซึ่งได้จำนวนแถวทั้งหมดเท่ากันทุกคอลัมน์\n• dropna() ลบแถวที่มีค่าว่าง จึงไม่เหลือค่าให้นับ\n• fillna() ต้องระบุค่าที่ใช้เติม และเป็นการเติมไม่ใช่การนับ"},{"n":11,"g":3,"q":"ข้อมูล [2, 4, 6, 8, 10, 30] มีค่ามัธยฐานและค่าเฉลี่ยเป็นเท่าใดตามลำดับ","c":[{"k":"a","t":"7 และ 10"},{"k":"b","t":"10 และ 7"},{"k":"c","t":"6 และ 10"},{"k":"d","t":"7 และ 8"}],"ans":"a","e":"• มัธยฐาน: ข้อมูลมี 6 ค่า ใช้ค่าเฉลี่ยของตำแหน่งที่ 3 และ 4 = (6 + 8) / 2 = 7\n• ค่าเฉลี่ย = (2 + 4 + 6 + 8 + 10 + 30) / 6 = 60 / 6 = 10\nสังเกตว่าค่า 30 ดึงค่าเฉลี่ย (10) ให้สูงกว่ามัธยฐาน (7) มาก"},{"n":12,"g":3,"q":"เมื่อข้อมูลมีค่าสูงผิดปกติมากเพียงหนึ่งค่า ข้อใดถูกต้อง","c":[{"k":"a","t":"มัธยฐานถูกดึงไปทางค่าสูงมากกว่าค่าเฉลี่ย"},{"k":"b","t":"ค่าเฉลี่ยถูกดึงไปทางค่าสูงมากกว่ามัธยฐาน"},{"k":"c","t":"ทั้งค่าเฉลี่ยและมัธยฐานไม่เปลี่ยนแปลง"},{"k":"d","t":"ส่วนเบี่ยงเบนมาตรฐานมีค่าลดลง"}],"ans":"b","e":"ค่าเฉลี่ยคำนวณจากทุกค่า จึงไวต่อค่าสุดโต่ง ส่วนมัธยฐานขึ้นกับค่าตรงกลางจึงทนต่อ outlier (robust) มากกว่า\nค่าสูงผิดปกติยังทำให้ส่วนเบี่ยงเบนมาตรฐาน “เพิ่มขึ้น” ไม่ใช่ลดลง"},{"n":13,"g":3,"q":"ค่า Pearson Correlation ระหว่างฟีเจอร์ A กับค่าเป้าหมายเท่ากับ −0.92 ควรตีความอย่างไร","c":[{"k":"a","t":"ฟีเจอร์ A มีความสัมพันธ์เชิงเส้นในทิศทางตรงกันข้ามอย่างชัดเจน"},{"k":"b","t":"ฟีเจอร์ A มีความสัมพันธ์เชิงเส้นในทิศทางเดียวกันอย่างชัดเจน"},{"k":"c","t":"ฟีเจอร์ A แทบไม่มีความสัมพันธ์เชิงเส้นกับค่าเป้าหมาย"},{"k":"d","t":"ฟีเจอร์ A ทำให้ค่าเป้าหมายลดลงร้อยละ 92"}],"ans":"a","e":"เครื่องหมายลบ = ทิศทางตรงข้าม (A เพิ่ม เป้าหมายมีแนวโน้มลด) และค่าสัมบูรณ์ 0.92 ใกล้ 1 = ความสัมพันธ์เชิงเส้นแข็งแรงมาก\nข้อสุดท้ายผิด เพราะสหสัมพันธ์ไม่ได้บอกความเป็นสาเหตุ และ 0.92 ไม่ใช่ร้อยละการเปลี่ยนแปลง"},{"n":14,"g":3,"q":"Histogram เหมาะสำหรับใช้สำรวจสิ่งใด","c":[{"k":"a","t":"ความสัมพันธ์ระหว่างตัวแปรเชิงปริมาณสองตัวแปร"},{"k":"b","t":"สัดส่วนของแต่ละกลุ่มเมื่อเทียบกับทั้งหมด"},{"k":"c","t":"การกระจายตัวของข้อมูลเชิงปริมาณหนึ่งตัวแปร"},{"k":"d","t":"แนวโน้มของข้อมูลที่เปลี่ยนไปตามเวลา"}],"ans":"c","e":"Histogram แบ่งช่วงค่าของตัวแปรหนึ่งตัวเป็นช่วง ๆ แล้วนับความถี่ ทำให้เห็นรูปร่างการกระจาย เช่น สมมาตร เบ้ หรือมีหลายยอด\n• ความสัมพันธ์ของสองตัวแปร ใช้ Scatter plot\n• สัดส่วนของกลุ่ม ใช้ Pie/Doughnut/Bar chart\n• แนวโน้มตามเวลา ใช้ Line chart"},{"n":15,"g":3,"q":"ฟีเจอร์ A, B, C, D มีค่า Pearson Correlation กับค่าเป้าหมายเท่ากับ 0.15, −0.78, 0.62 และ −0.05 ตามลำดับ ฟีเจอร์ใดมีความสัมพันธ์เชิงเส้นกับค่าเป้าหมายมากที่สุด","c":[{"k":"a","t":"ฟีเจอร์ A"},{"k":"b","t":"ฟีเจอร์ C"},{"k":"c","t":"ฟีเจอร์ D"},{"k":"d","t":"ฟีเจอร์ B"}],"ans":"d","e":"ความแข็งแรงของความสัมพันธ์ดูจาก “ค่าสัมบูรณ์” ของ r ไม่ใช่เครื่องหมาย\n|A| = 0.15, |B| = 0.78, |C| = 0.62, |D| = 0.05\nฟีเจอร์ B มีค่าสัมบูรณ์สูงสุด (แม้เป็นค่าลบ) จึงสัมพันธ์เชิงเส้นมากที่สุด ข้อผิดที่พบบ่อยคือเลือก C เพราะเห็นว่าเป็นค่าบวกที่มากที่สุด"},{"n":16,"g":4,"q":"ชุดข้อมูลทดสอบ (test set) ควรใช้เพื่อวัตถุประสงค์ใด","c":[{"k":"a","t":"ปรับค่าสัมประสิทธิ์ของโมเดลให้เหมาะสม"},{"k":"b","t":"เพิ่มจำนวนข้อมูลสำหรับสร้างโมเดล"},{"k":"c","t":"คัดเลือกฟีเจอร์ที่จะนำไปใช้สร้างโมเดล"},{"k":"d","t":"ประเมินประสิทธิภาพของโมเดลกับข้อมูลที่โมเดลไม่เคยเรียนรู้มาก่อน"}],"ans":"d","e":"ข้อมูลทดสอบต้องแยกจากข้อมูลที่ใช้สร้างโมเดล เพื่อให้ผลประเมินสะท้อนความสามารถในการทำนายข้อมูลใหม่จริง\nถ้านำชุดทดสอบไปปรับค่าสัมประสิทธิ์ เพิ่มข้อมูลสร้างโมเดล หรือเลือกฟีเจอร์ ข้อมูลจะรั่วไหล (data leakage) และผลประเมินจะดีเกินจริง"},{"n":17,"g":4,"q":"โจทย์ “ทำนายว่าลูกค้ารายหนึ่งจะยกเลิกสมาชิกหรือไม่” จัดเป็นการวิเคราะห์แบบใด","c":[{"k":"a","t":"Regression Analysis"},{"k":"b","t":"Classification Analysis"},{"k":"c","t":"Cluster Analysis"},{"k":"d","t":"Prescriptive Analytics"}],"ans":"b","e":"ผลลัพธ์ที่ต้องการเป็นประเภท (ยกเลิก/ไม่ยกเลิก) และมีค่าจริงในอดีตให้เรียนรู้ จึงเป็น Classification\n• Regression ทำนายค่าตัวเลขต่อเนื่อง\n• Cluster Analysis จัดกลุ่มโดยไม่มีค่าเป้าหมาย\n• Prescriptive แนะนำการกระทำ"},{"n":18,"g":4,"q":"หากแบ่งข้อมูล 100 ตัวอย่างด้วย 5-Fold Cross-Validation แต่ละรอบจะมีข้อมูลสำหรับทดสอบกี่ตัวอย่าง","c":[{"k":"a","t":"20 ตัวอย่าง"},{"k":"b","t":"5 ตัวอย่าง"},{"k":"c","t":"80 ตัวอย่าง"},{"k":"d","t":"100 ตัวอย่าง"}],"ans":"a","e":"5-Fold แบ่งข้อมูลเป็น 5 ส่วนเท่า ๆ กัน = 100 / 5 = 20 ตัวอย่างต่อส่วน ในแต่ละรอบใช้ 1 ส่วนเป็นชุดทดสอบ (20 ตัวอย่าง) และอีก 4 ส่วนเป็นชุดสร้างโมเดล (80 ตัวอย่าง) แล้วหมุนเวียนจนทุกส่วนได้เป็นชุดทดสอบครบ 5 รอบ"},{"n":19,"g":4,"q":"โมเดลหนึ่งมี Accuracy 99% บนชุดข้อมูลสร้างโมเดล แต่ได้เพียง 70% บนชุดข้อมูลทดสอบ สถานการณ์นี้บ่งชี้ถึงปัญหาใดมากที่สุด","c":[{"k":"a","t":"Underfitting"},{"k":"b","t":"โมเดลมีความเหมาะสมดีแล้ว"},{"k":"c","t":"ข้อมูลทดสอบมีจำนวนมากเกินไป"},{"k":"d","t":"Overfitting"}],"ans":"d","e":"Overfitting คือโมเดลจดจำรายละเอียดและสัญญาณรบกวนของข้อมูลสร้างโมเดลมากเกินไป จึงทำนายข้อมูลใหม่ได้แย่ ลักษณะเด่นคือผลบนชุด train สูงมากแต่ชุด test ต่ำกว่ามาก\n• Underfitting คือผลต่ำทั้งสองชุด\n• ช่องว่างผลที่ใหญ่ถึง 29 จุดไม่ใช่สัญญาณของโมเดลที่เหมาะสม"},{"n":20,"g":5,"q":"จากค่าจริง y = [5, 10, 15, 20] และค่าพยากรณ์ ŷ = [6, 8, 16, 24] ค่า MAE เป็นเท่าใด","c":[{"k":"a","t":"1.5"},{"k":"b","t":"2.0"},{"k":"c","t":"2.5"},{"k":"d","t":"5.5"}],"ans":"b","e":"ค่าคลาดเคลื่อนสัมบูรณ์ |y − ŷ| = |5−6| = 1, |10−8| = 2, |15−16| = 1, |20−24| = 4\nMAE = (1 + 2 + 1 + 4) / 4 = 8 / 4 = 2.0\n(5.5 คือค่า MSE ของข้อมูลชุดนี้ ไม่ใช่ MAE)"},{"n":21,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า MSE เป็นเท่าใด","c":[{"k":"a","t":"4.0"},{"k":"b","t":"5.0"},{"k":"c","t":"8.0"},{"k":"d","t":"5.5"}],"ans":"d","e":"ความคลาดเคลื่อนยกกำลังสอง = 1², 2², 1², 4² = 1, 4, 1, 16\nMSE = (1 + 4 + 1 + 16) / 4 = 22 / 4 = 5.5"},{"n":22,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า RMSE มีค่าใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"2.00"},{"k":"b","t":"2.75"},{"k":"c","t":"2.35"},{"k":"d","t":"5.50"}],"ans":"c","e":"RMSE = √MSE = √5.5 ≈ 2.345 ≈ 2.35\nสังเกตว่า RMSE (2.35) มากกว่า MAE (2.0) เสมอเมื่อความคลาดเคลื่อนไม่เท่ากัน เพราะค่าคลาดเคลื่อนใหญ่อย่าง 4 ถูกเน้นด้วยการยกกำลังสอง"},{"n":23,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า MAPE มีค่าใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"ร้อยละ 13.3"},{"k":"b","t":"ร้อยละ 16.7"},{"k":"c","t":"ร้อยละ 20.0"},{"k":"d","t":"ร้อยละ 25.0"}],"ans":"b","e":"|y − ŷ| / |y| = 1/5 = 0.200, 2/10 = 0.200, 1/15 ≈ 0.067, 4/20 = 0.200\nรวม ≈ 0.667 → MAPE = 0.667 / 4 × 100 ≈ 16.7%"},{"n":24,"g":5,"q":"จากโมเดล ŷ = 10 + 2.5(x1) + 4(x2) หากค่า x1 เพิ่มขึ้น 4 หน่วยโดยที่ x2 คงที่ ค่า ŷ จะเปลี่ยนแปลงอย่างไร","c":[{"k":"a","t":"เพิ่มขึ้น 2.5 หน่วย"},{"k":"b","t":"เพิ่มขึ้น 4 หน่วย"},{"k":"c","t":"เพิ่มขึ้น 14 หน่วย"},{"k":"d","t":"เพิ่มขึ้น 10 หน่วย"}],"ans":"d","e":"สัมประสิทธิ์ของ x1 คือ 2.5 หมายถึง เมื่อ x1 เพิ่ม 1 หน่วย ŷ เพิ่ม 2.5 หน่วย (เมื่อตัวแปรอื่นคงที่)\nx1 เพิ่ม 4 หน่วย → ŷ เปลี่ยน = 2.5 × 4 = +10 หน่วย\nค่าคงที่ 10 และสัมประสิทธิ์ 4 ของ x2 ไม่เกี่ยวข้อง เพราะ x2 คงที่"},{"n":25,"g":5,"q":"กำหนดให้ X = [[1, 4, 2], [1, 5, 3]] และ theta = [2, 1, 3] ค่า ŷ ของแถวที่สองเป็นเท่าใด","c":[{"k":"a","t":"12"},{"k":"b","t":"14"},{"k":"c","t":"18"},{"k":"d","t":"16"}],"ans":"d","e":"ŷ = X · θ แถวที่สอง [1, 5, 3] · [2, 1, 3] = 1×2 + 5×1 + 3×3 = 2 + 5 + 9 = 16\n(ค่า 12 คือผลของแถวแรก: 2 + 4 + 6 = 12)"},{"n":26,"g":5,"q":"ในเทคนิค Gradient Descent ค่า Learning Rate ที่มากเกินไปจะส่งผลอย่างไร","c":[{"k":"a","t":"ต้องใช้จำนวนรอบมากขึ้นกว่าจะลู่เข้าสู่ค่าที่เหมาะสม"},{"k":"b","t":"ลู่เข้าสู่ค่าที่เหมาะสมได้เร็วและแม่นยำที่สุดเสมอ"},{"k":"c","t":"การปรับค่าแต่ละรอบอาจก้าวข้ามจุดที่เหมาะสม ทำให้ค่าคลาดเคลื่อนแกว่งหรือเพิ่มขึ้น"},{"k":"d","t":"ค่าสัมประสิทธิ์จะไม่เปลี่ยนแปลงเลยตลอดกระบวนการ"}],"ans":"c","e":"Learning rate คือขนาดก้าวในการปรับค่า ถ้าใหญ่เกินไปจะกระโดดข้ามจุดต่ำสุดของ loss ไปมา อาจแกว่งหรือลู่ออก\n• ต้องใช้รอบมากขึ้น เป็นผลของ learning rate ที่น้อยเกินไป\n• ไม่ได้ลู่เข้าเร็วและแม่นยำเสมอ"},{"n":27,"g":6,"q":"ระบบวินิจฉัยโรคทำนายว่าผู้ป่วยรายหนึ่งเป็นโรค แต่ความจริงผู้ป่วยรายนั้นไม่ได้เป็นโรค กรณีนี้จัดเป็นอะไร","c":[{"k":"a","t":"True-Positive"},{"k":"b","t":"True-Negative"},{"k":"c","t":"False-Positive"},{"k":"d","t":"False-Negative"}],"ans":"c","e":"ผลทำนาย = Positive (เป็นโรค) แต่ค่าจริง = Negative (ไม่เป็น) จึงทำนายบวกผิด = False-Positive (เตือนผิด)\nเทียบกับข้อสอบที่ทำนายลบแต่จริงเป็นบวก ซึ่งเป็น False-Negative (พลาดการจับ)"},{"n":28,"g":6,"q":"จากเมทริกซ์คอนฟิวชัน TP = 45, TN = 35, FP = 5, FN = 15 ค่า Precision เป็นเท่าใด","c":[{"k":"a","t":"0.90"},{"k":"b","t":"0.75"},{"k":"c","t":"0.80"},{"k":"d","t":"0.82"}],"ans":"a","e":"Precision = TP / (TP + FP) = 45 / (45 + 5) = 45 / 50 = 0.90 หมายถึง ในรายการที่โมเดลทำนายว่าเป็นบวก ถูกต้องร้อยละ 90\n• 0.75 คือ Recall (45/60)\n• 0.80 คือ Accuracy (80/100)\n• 0.82 คือ F1 ≈ 0.818"},{"n":29,"g":6,"q":"จากเมทริกซ์คอนฟิวชันเดียวกันในข้อ 28 ค่า Recall เป็นเท่าใด","c":[{"k":"a","t":"0.90"},{"k":"b","t":"0.80"},{"k":"c","t":"0.70"},{"k":"d","t":"0.75"}],"ans":"d","e":"Recall = TP / (TP + FN) = 45 / (45 + 15) = 45 / 60 = 0.75 หมายถึง ในรายการที่เป็นบวกจริงทั้งหมด โมเดลจับได้ร้อยละ 75"},{"n":30,"g":6,"q":"หากแบ่งข้อมูลได้ 10 ตัวอย่าง เป็นคลาส A จำนวน 3 ตัวอย่าง และคลาส B จำนวน 7 ตัวอย่าง ค่า GINI เป็นเท่าใด","c":[{"k":"a","t":"0.300"},{"k":"b","t":"0.420"},{"k":"c","t":"0.500"},{"k":"d","t":"0.580"}],"ans":"b","e":"Gini = 1 − Σ pᵢ² โดย p(A) = 0.3, p(B) = 0.7\nGini = 1 − (0.09 + 0.49) = 1 − 0.58 = 0.42\n(0.58 คือผลรวม Σ pᵢ² ที่ยังไม่ได้นำไปลบออกจาก 1)"},{"n":31,"g":6,"q":"ในสมการ Logistic Regression P = 1 / (1 + e^−(b0 + BX)) หากค่า b0 + BX มีค่ามากเป็นบวก เช่น 10 ค่า P จะเข้าใกล้ค่าใด","c":[{"k":"a","t":"1"},{"k":"b","t":"0"},{"k":"c","t":"0.5"},{"k":"d","t":"ค่าติดลบ"}],"ans":"a","e":"เมื่อ b0 + BX = 10 จะได้ e^−10 ≈ 0.000045 ดังนั้น P = 1 / (1 + 0.000045) ≈ 0.99995 ซึ่งเข้าใกล้ 1\nP เป็นความน่าจะเป็น จึงอยู่ระหว่าง 0 ถึง 1 เสมอ ไม่มีทางติดลบ ส่วน P = 0.5 เกิดเมื่อ b0 + BX = 0"},{"n":32,"g":7,"q":"ข้อมูลหนึ่งมิติ [1, 3, 4, 10, 12] ใช้ K-Means โดย K = 2 เริ่มต้นจุดศูนย์กลางที่ตำแหน่ง 1 และ 10 หลังรอบแรกจุดศูนย์กลางฝั่งซ้ายจะอยู่ที่ตำแหน่งใดใกล้เคียงที่สุด","c":[{"k":"a","t":"2.0"},{"k":"b","t":"2.67"},{"k":"c","t":"3.0"},{"k":"d","t":"4.0"}],"ans":"b","e":"จัดกลุ่มรอบแรก: 1 → c1 (1); 3 ห่างจาก 1 เท่ากับ 2 และห่างจาก 10 เท่ากับ 7 → c1; 4 ห่าง 3 และ 6 → c1; 10 → c2; 12 → c2\nจุดศูนย์กลางใหม่ฝั่งซ้าย = (1 + 3 + 4) / 3 = 8/3 ≈ 2.67 (ฝั่งขวา = (10 + 12)/2 = 11)"},{"n":33,"g":7,"q":"จากข้อ 32 เมื่อกระบวนการเสร็จสิ้น สมาชิกของกลุ่มที่มีจุดศูนย์กลางค่ามากกว่าคือข้อใด","c":[{"k":"a","t":"{12}"},{"k":"b","t":"{4, 10, 12}"},{"k":"c","t":"{3, 4, 10, 12}"},{"k":"d","t":"{10, 12}"}],"ans":"d","e":"รอบที่สองใช้จุดศูนย์กลาง 2.67 และ 11 : จุด 4 ห่างจาก 2.67 เท่ากับ 1.33 แต่ห่างจาก 11 เท่ากับ 7 จึงยังอยู่กลุ่มซ้าย จุด 10 ห่างจาก 11 เท่ากับ 1 จึงอยู่กลุ่มขวา การจัดกลุ่มไม่เปลี่ยน จึงลู่เข้า\nกลุ่มที่จุดศูนย์กลางมากกว่า (11) คือ {10, 12}"},{"n":34,"g":7,"q":"กำหนดข้อมูลหนึ่งมิติ P = {1, 2, 3, 7, 8, 9, 15, 16} ใช้ DBSCAN โดย eps = 1 และ min_samples = 3 (นับตัวเองด้วย) จุดใดเป็น core point","c":[{"k":"a","t":"1 และ 3"},{"k":"b","t":"8 และ 9"},{"k":"c","t":"2 และ 8"},{"k":"d","t":"2, 3, 8 และ 9"}],"ans":"c","e":"Core point คือจุดที่มีจุดภายในระยะ eps = 1 (รวมตัวเอง) ≥ 3 จุด\n• 1: {1, 2} = 2 ✗ • 2: {1, 2, 3} = 3 ✓ • 3: {2, 3} = 2 ✗\n• 7: {7, 8} = 2 ✗ • 8: {7, 8, 9} = 3 ✓ • 9: {8, 9} = 2 ✗\n• 15: {15, 16} = 2 ✗ • 16: {15, 16} = 2 ✗\nดังนั้น core point คือ 2 และ 8"},{"n":35,"g":7,"q":"จากข้อ 34 จำนวนกลุ่มที่เกิดขึ้น (ไม่นับ noise) และจำนวน noise point เป็นเท่าใดตามลำดับ","c":[{"k":"a","t":"3 กลุ่ม และ 0 จุด"},{"k":"b","t":"2 กลุ่ม และ 4 จุด"},{"k":"c","t":"2 กลุ่ม และ 2 จุด"},{"k":"d","t":"3 กลุ่ม และ 2 จุด"}],"ans":"c","e":"กลุ่มที่ 1 = core 2 พร้อม border 1 และ 3 → {1, 2, 3}\nกลุ่มที่ 2 = core 8 พร้อม border 7 และ 9 → {7, 8, 9}\nจุด 15 และ 16 ไม่เป็น core และไม่อยู่ในระยะ eps ของ core ใดเลย จึงเป็น noise = 2 จุด\nสรุป 2 กลุ่ม และ noise 2 จุด"},{"n":36,"g":7,"q":"ตัวชี้วัดใดใช้ประเมินคุณภาพของ Cluster Analysis ได้โดยไม่ต้องมีค่าคลาสจริง","c":[{"k":"a","t":"Accuracy"},{"k":"b","t":"Silhouette Score"},{"k":"c","t":"Recall"},{"k":"d","t":"MAE"}],"ans":"b","e":"Silhouette Score วัดว่าแต่ละจุดอยู่ใกล้กลุ่มตัวเองและห่างจากกลุ่มอื่นเพียงใด ใช้เพียงระยะทางระหว่างจุด ไม่ต้องมีค่าคลาสจริง\nAccuracy และ Recall ต้องเทียบกับคลาสจริง (Classification) ส่วน MAE ใช้ประเมินงาน Regression"},{"n":37,"g":8,"q":"รายการแนะนำเรียงคะแนนจากมากไปน้อย 10 รายการ โดยมี test item อยู่ในลำดับที่ 2, 6 และ 9 หากกำหนด K = 5 ค่า Top-K Precision เป็นเท่าใด","c":[{"k":"a","t":"0.20"},{"k":"b","t":"0.30"},{"k":"c","t":"0.40"},{"k":"d","t":"0.60"}],"ans":"a","e":"Top-K Precision = จำนวน test item ที่อยู่ใน K อันดับแรก / K\nใน 5 อันดับแรก มี test item เพียงอันดับที่ 2 (อันดับ 6 และ 9 อยู่นอก top 5) = 1 รายการ\nPrecision@5 = 1/5 = 0.20"},{"n":38,"g":8,"q":"จากข้อ 37 ค่า hit@1 เป็นเท่าใด","c":[{"k":"a","t":"1"},{"k":"b","t":"0.2"},{"k":"c","t":"0"},{"k":"d","t":"3"}],"ans":"c","e":"hit@K = 1 ถ้ามี test item อย่างน้อยหนึ่งรายการอยู่ใน K อันดับแรก มิฉะนั้นเป็น 0\nอันดับที่ 1 ไม่ใช่ test item (test item อยู่อันดับ 2, 6, 9) จึงได้ hit@1 = 0\n(ถ้าเป็น hit@2 จะได้ 1)"},{"n":39,"g":8,"q":"ในการหาค่า AUC ของระบบแนะนำ หากมีการเปรียบเทียบทั้งหมด 20 คู่ โดยชนะ 13 คู่ เสมอ 4 คู่ และแพ้ 3 คู่ ค่า AUC เป็นเท่าใด","c":[{"k":"a","t":"0.65"},{"k":"b","t":"0.80"},{"k":"c","t":"0.75"},{"k":"d","t":"0.85"}],"ans":"c","e":"AUC = (จำนวนคู่ที่ชนะ + 0.5 × จำนวนคู่ที่เสมอ ต์ 3 มิติ เส้นกริดหนา และสีที่ไม่จำเป็น เพื่อให้ผู้อ่านโฟกัสประเด็นสำคัญและเข้าใจได้เร็ว ซึ่งตรงกับเป้าหมายของการนำเสนอข้อมูลเชิงภาพ"},{"n":47,"g":9,"q":"ต้องการแสดงแนวโน้มอุณหภูมิเฉลี่ยรายวันตลอด 30 วัน ควรเลือกแผนภูมิชนิดใด","c":[{"k":"a","t":"แผนภูมิวงกลม (Pie Chart)"},{"k":"b","t":"แผนภูมิแท่งแนวตั้งแบบซ้อน 3 มิติ"},{"k":"c","t":"แผนภูมิเส้น (Line Chart)"},{"k":"d","t":"แผนภูมิกระจาย (Scatter Plot) ที่ไม่เชื่อมจุดและไม่เรียงตามเวลา"}],"ans":"c","e":"ข้อมูลที่เรียงตามเวลาและต้องการดูแนวโน้ม เหมาะกับแผนภูมิเส้น เพราะเส้นเชื่อมจุดตามลำดับเวลาทำให้เห็นทิศทางการเปลี่ยนแปลงชัดเจน\nPie chart แสดงสัดส่วน ส่วนแท่ง 3 มิติแบบซ้อนตีความยาก และ Scatter plot ที่ไม่เรียงตามเวลาไม่แสดงแนวโน้ม"},{"n":48,"g":9,"q":"ต้องการแสดงความสัมพันธ์ระหว่างความสูงและน้ำหนักของนักเรียน 200 คน ควรเลือกแผนภูมิชนิดใด","c":[{"k":"a","t":"แผนภูมิวงกลม (Pie Chart)"},{"k":"b","t":"แผนภูมิกระจาย (Scatter Plot)"},{"k":"c","t":"ฮิสโตแกรมของความสูงอย่างเดียว"},{"k":"d","t":"แผนภูมิเส้นที่เรียงตามชื่อนักเรียน"}],"ans":"b","e":"Scatter plot วางตัวแปรสองตัวบนแกน X และ Y และแต่ละจุดแทนข้อมูลหนึ่งแถว จึงเห็นรูปแบบความสัมพันธ์ (ทิศทาง ความแรง และ outlier) ได้ชัดเจน\nHistogram ดูได้เพียงตัวแปรเดียว Pie chart แสดงสัดส่วน และแผนภูมิเส้นเหมาะกับข้อมูลที่เรียงตามเวลา"},{"n":49,"g":9,"q":"รายงานที่จะนำเสนอแก่ผู้อ่านหลายประเทศ ข้อใดเป็นสิ่งที่ควรตรวจสอบเพื่อ Localization","c":[{"k":"a","t":"รูปแบบวันที่ สกุลเงิน และความหมายของสีในวัฒนธรรมของผู้อ่าน"},{"k":"b","t":"จำนวนหน้าของรายงานให้เท่ากันทุกภาษา"},{"k":"c","t":"ชนิดของโปรแกรมที่ใช้สร้างแผนภูมิ"},{"k":"d","t":"ความละเอียดของภาพที่บันทึกลงในไฟล์"}],"ans":"a","e":"Localization คือการปรับเนื้อหาให้เหมาะกับบริบทของผู้อ่าน เช่น รูปแบบวันที่ (วัน/เดือน/ปี หรือ เดือน/วัน/ปี) สกุลเงิน เครื่องหมายทศนิยม และความหมายของสีที่ต่างกันตามวัฒนธรรม\nจำนวนหน้า ชนิดโปรแกรม และความละเอียดภาพ ไม่เกี่ยวกับบริบททางวัฒนธรรมของผู้อ่าน"},{"n":50,"g":9,"q":"ต้องการให้ผู้อ่านสังเกตเห็นแท่งที่มียอดขายสูงสุดเพียงแท่งเดียวจากแผนภูมิแท่ง 12 แท่ง ควรทำอย่างไร","c":[{"k":"a","t":"ใช้สีต่างกันทุกแ const L=['a','b','c','d'];
const $=s=>document.querySelector(s),app=$('#app');
let state,curSet=1;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
$('#theme').onclick=()=>{const d=document.documentElement;const dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0f141c';d.dataset.theme=dark?'light':'dark'};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const getSet=id=>SETS.find(s=>s.id===id);

// prepare a question: optionally shuffle its choices, relabel a-d and remap letter references in the explanation
function prep(q,shuf){
  const order=shuf?shuffle(q.c):q.c, map={};
  const c=order.map((o,i)=>{map[o.k]=L[i];return {k:L[i],t:o.t}});
  return {...q,c,ans:map[q.ans],e:q.e.replace(/\(([a-d])\)/g,(m,x)=>'('+(map[x]||x)+')'),raw:q};
}

function home(){
  const S=getSet(curSet),best=store.get('best'+curSet);
  app.innerHTML=`<div class="card">
   <h2 style="margin-top:0">เลือกชุดข้อสอบ</h2>
   <div class="seg">${SETS.map(s=>`<button class="segbtn ${s.id===curSet?'on':''}" data-s="${s.id}">${esc(s.name)}</button>`).join('')}</div>
   <p style="color:var(--muted)">ตอบแล้วเห็นเฉลยและคำอธิบายทันที · ${S.qs.length} ข้อ ${S.groups.length} กลุ่ม${best!=null?` · คะแนนดีที่สุดของชุดนี้: <b>${best}%</b>`:''}</p>
   <div class="grid">
    <label class="opt2"><input type="checkbox" id="all" checked> <b>ทุกกลุ่ม (${S.qs.length} ข้อ)</b></label>
    ${S.groups.map(g=>`<label class="opt2"><input type="checkbox" class="g" value="${g.id}" checked> กลุ่มที่ ${g.id}: ${esc(g.name)} <span style="margin-left:auto;color:var(--muted)">${S.qs.filter(q=>q.g===g.id).length} ข้อ</span></label>`).join('')}
    <label class="opt2"><input type="checkbox" id="shufq"> สลับลำดับข้อ</label>
    <label class="opt2"><input type="checkbox" id="shufc"> สลับตัวเลือกตั้งแต่รอบแรก <span style="color:var(--muted);font-size:.85rem">(กด “ทำใหม่” จะสลับตัวเลือกให้เสมอ)</span></label>
   </div>
   <button class="btn" id="start">เริ่มทำข้อสอบ</button></div>`;
  document.querySelectorAll('.segbtn').forEach(b=>b.onclick=()=>{curSet=+b.dataset.s;home()});
  const all=$('#all'),gs=[...document.querySelectorAll('.g')];
  all.onchange=()=>gs.forEach(c=>c.checked=all.checked);
  gs.forEach(c=>c.onchange=()=>all.checked=gs.every(x=>x.checked));
  $('#start').onclick=()=>{
    const ids=gs.filter(c=>c.checked).map(c=>+c.value);
    if(!ids.length){alert('กรุณาเลือกอย่างน้อย 1 กลุ่ม');return}
    let qs=S.qs.filter(q=>ids.includes(q.g));
    if($('#shufq').checked)qs=shuffle(qs);
    start(qs,$('#shufc').checked);
  };
}
function start(rawQs,shufChoices){state={raw:rawQs,qs:rawQs.map(q=>prep(q,shufChoices)),i:0,ans:{}};render();window.scrollTo(0,0)}
function render(){
  const {qs,i,ans}=state,q=qs[i],picked=ans[i],done=picked!=null;
  const S=getSet(curSet),g=S.groups.find(x=>x.id===q.g);
  const correct=qs.filter((x,j)=>ans[j]===x.ans).length,answered=Object.keys(ans).length;
  app.innerHTML=`<div class="card">
   <div class="meta"><span>ข้อ ${i+1} / ${qs.length}</span><span>ถูก ${correct} / ตอบแล้ว ${answered}</span></div>
   <div class="bar"><i style="width:${(i+(done?1:0))/qs.length*100}%"></i></div>
   <span class="tag">ชุดที่ ${curSet} · กลุ่มที่ ${g.id}: ${esc(g.name)}</span>
   <div class="q">${q.n}. ${esc(q.q)}</div>
   <div class="opts">${q.c.map(o=>{let cls='';if(done){if(o.k===q.ans)cls='ok';else if(o.k===picked)cls='bad'}
     return `<button class="opt ${cls}" data-k="${o.k}" ${done?'disabled':''}><span class="k">${o.k.toUpperCase()}</span><span>${esc(o.t)}</span></button>`}).join('')}</div>
   ${done?`<div class="exp ${picked===q.ans?'ok':'bad'}"><b class="h">${picked===q.ans?'✔ ถูกต้อง!':'✘ ยังไม่ถูก — คำตอบที่ถูกคือ ('+q.ans+')'}</b><p>${esc(q.e)}</p></div>`:''}
   <div class="nav"><button class="btn sec" id="prev" ${i===0?'disabled':''}>← ก่อนหน้า</button>
   <button class="btn" id="next" ${done?'':'disabled'}>${i===qs.length-1?'ดูผลคะแนน':'ข้อถัดไป →'}</button></div>
   <div class="dots">${qs.map((x,j)=>`<button class="dot ${ans[j]!=null?(ans[j]===x.ans?'ok':'bad'):''} ${j===i?'cur':''}" data-j="${j}">${j+1}</button>`).join('')}</div>
  </div>
  <p style="text-align:center"><button class="icon" id="quit">กลับหน้าแรก</button></p>`;
  document.querySelectorAll('.opt:not(:disabled)').forEach(b=>b.onclick=()=>{state.ans[i]=b.dataset.k;render();document.querySelector('.exp')?.scrollIntoView({block:'nearest',behavior:'smooth'})});
  $('#prev').onclick=()=>{state.i--;render()};
  $('#next').onclick=()=>{if(i===qs.length-1)result();else{state.i++;render();window.scrollTo(0,0)}};
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{state.i=+d.dataset.j;render()});
  $('#quit').onclick=()=>{if(confirm('ออกจากข้อสอบและกลับหน้าแรก?'))home()};
}
function result(){
  const {qs,ans}=state,right=qs.filter((x,j)=>ans[j]===x.ans).length,pct=Math.round(right/qs.length*100);
  if(qs.length===getSet(curSet).qs.length){const b=store.get('best'+curSet);if(b==null||pct>b)store.set('best'+curSet,pct)}
  const wrong=qs.map((x,j)=>({x,j})).filter(o=>ans[o.j]!==o.x.ans);
  const msg=pct>=80?'ยอดเยี่ยมมาก! 🎉':pct>=60?'ทำได้ดี สู้ต่ออีกนิด 💪':'ลองทบทวนข้อที่พลาดแล้วทำใหม่อีกครั้ง 📚';
  app.innerHTML=`<div class="card" style="text-align:center"><p style="margin:0;color:var(--muted)">คะแนนของคุณ · ชุดที่ ${curSet}</p><p class="score">${right} / ${qs.length}</p><p>${pct}% — ${msg}</p>
   <button class="btn" id="again">ทำใหม่ (สลับตัวเลือก)</button> <button class="btn sec" id="home">กลับหน้าแรก</button>
   ${wrong.length?`<button class="btn sec" id="redo">ทำเฉพาะข้อที่ผิด (${wrong.length})</button>`:''}</div>
   ${wrong.length?`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">ข้อที่ตอบผิด</h3>${wrong.map(({x,j})=>`<div class="rev"><b>${x.n}. ${esc(x.q)}</b><br>คุณตอบ: (${ans[j]}) ${esc(x.c.find(o=>o.k===ans[j]).t)}<br><span style="color:var(--ok)">เฉลย: (${x.ans}) ${esc(x.c.find(o=>o.k===x.ans).t)}</span><p style="color:var(--muted);white-space:pre-wrap;margin:6px 0 0">${esc(x.e)}</p></div>`).join('')}</div>`:''}`;
  $('#again').onclick=()=>start(state.raw,true);$('#home').onclick=home;
  const r=$('#redo');if(r)r.onclick=()=>start(wrong.map(o=>o.x.raw),true);
  window.scrollTo(0,0);
}
home();
</script>
</body>
