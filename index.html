<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ควิซการวิเคราะห์ข้อมูล 50 ข้อ</title>
<meta name="description" content="แบบฝึกหัดปรนัยการวิเคราะห์ข้อมูล 50 ข้อ พร้อมเฉลยและคำอธิบายทันทีหลังตอบ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--line:#dfe4ec;--accent:#2563eb;--accent-soft:#e8f0fe;--ok:#15803d;--ok-bg:#e7f6ec;--bad:#b42318;--bad-bg:#fdecea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141c;--card:#171e29;--text:#e8ecf3;--muted:#98a2b3;--line:#2a3342;--accent:#6ea0ff;--accent-soft:#1c2a44;--ok:#5fd38a;--ok-bg:#12301f;--bad:#ff8f84;--bad-bg:#3a1a17}}
:root[data-theme=dark]{--bg:#0f141c;--card:#171e29;--text:#e8ecf3;--muted:#98a2b3;--line:#2a3342;--accent:#6ea0ff;--accent-soft:#1c2a44;--ok:#5fd38a;--ok-bg:#12301f;--bad:#ff8f84;--bad-bg:#3a1a17}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.25rem;margin:0}
button{font:inherit;cursor:pointer}
.icon{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 22px;font-weight:600}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.q{font-size:1.1rem;font-weight:600;margin:6px 0}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.8rem;border-radius:99px;padding:1px 10px;margin-bottom:6px}
.exp{border-radius:12px;padding:14px 16px;margin-top:6px}
.exp.ok{background:var(--ok-bg);border-left:5px solid var(--ok)}
.exp.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.exp b.h{display:block;margin-bottom:4px}
.exp p{margin:2px 0;white-space:pre-wrap}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.grid{display:grid;gap:10px;margin:16px 0}
label.opt2{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.score{font-size:3rem;font-weight:700;color:var(--accent);margin:0}
.rev{border-top:1px solid var(--line);padding:10px 0}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:.8rem;padding:0}
.dot.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.dot.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.dot.cur{outline:2px solid var(--accent)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1>📊 ควิซการวิเคราะห์ข้อมูล</h1><button class="icon" id="theme" aria-label="สลับธีม">🌓</button></header>
<main id="app"></main>
</div>
<script>
const DATA={"groups":[{"id":1,"name":"บทนำและแนวคิดการวิเคราะห์ข้อมูล"},{"id":2,"name":"การจัดการประมวลผลข้อมูล"},{"id":3,"name":"การสำรวจข้อมูลเบื้องต้น"},{"id":4,"name":"แนวทางการวิเคราะห์ข้อมูล"},{"id":5,"name":"การวิเคราะห์การถดถอย"},{"id":6,"name":"การวิเคราะห์จำแนกประเภท"},{"id":7,"name":"การวิเคราะห์จัดกลุ่ม"},{"id":8,"name":"ระบบแนะนำ"},{"id":9,"name":"การนำเสนอข้อมูลเชิงภาพ"}],"qs":[{"n":1,"g":1,"q":"ข้อใดจัดเป็นคำถามระดับ Predictive Analytics","c":[{"k":"a","t":"เดือนใดของปีที่แล้วมียอดขายสูงสุด"},{"k":"b","t":"ไตรมาสหน้าลูกค้ารายนี้จะกลับมาซื้อซ้ำหรือไม่"},{"k":"c","t":"จำนวนผู้ใช้งานเฉลี่ยต่อวันในไตรมาสที่ผ่านมาเป็นเท่าใด"},{"k":"d","t":"ควรนำเสนอสินค้ากลุ่มใดแก่ลูกค้ารายนี้เพื่อให้เกิดยอดขายสูงสุด"}],"ans":"b","e":"Predictive Analytics ตอบคำถามว่า “อนาคตจะเกิดอะไรขึ้น” โดยใช้ข้อมูลในอดีตสร้างโมเดลพยากรณ์ การที่ลูกค้าจะกลับมาซื้อซ้ำในไตรมาสหน้าหรือไม่ คือการทำนายเหตุการณ์ในอนาคต\n• (a) และ (c) เป็นการสรุปข้อมูลในอดีต = Descriptive\n• (d) ถามว่า “ควรทำอะไร” เพื่อให้ได้ผลลัพธ์ดีที่สุด = Prescriptive"},{"n":2,"g":1,"q":"บุคคลที่มีทักษะการเขียนโปรแกรมและเข้าใจธุรกิจเป็นอย่างดี แต่ขาดพื้นฐานคณิตศาสตร์และสถิติ มีความเสี่ยงต่อสิ่งใดมากที่สุด","c":[{"k":"a","t":"สร้างโมเดลที่ดูแม่นยำในการทดสอบแต่ตีความข้อมูลผิดพลาด"},{"k":"b","t":"ใช้เวลาในการเตรียมข้อมูลนานกว่าปกติหลายเท่า"},{"k":"c","t":"ไม่สามารถนำโมเดลไปติดตั้งใช้งานจริงได้"},{"k":"d","t":"ไม่สามารถสื่อสารผลการวิเคราะห์ให้ผู้บริหารเข้าใจได้อย่างชัดเจน"}],"ans":"a","e":"คนที่เขียนโปรแกรมเก่งแต่ขาดพื้นฐานสถิติ จะรันโมเดลได้ แต่ไม่เข้าใจข้อสมมติ ความเอนเอียง การรั่วไหลของข้อมูล (data leakage) หรือ overfitting จึงอาจได้โมเดลที่คะแนนทดสอบดูดีแต่ตีความผลผิด ซึ่งเป็นความเสี่ยงที่ร้ายแรงที่สุด\n• (b) เวลาเตรียมข้อมูลขึ้นกับทักษะการเขียนโปรแกรม ซึ่งผู้นี้มีอยู่แล้ว\n• (c) การนำโมเดลไปติดตั้งเป็นทักษะด้านโปรแกรมมิ่ง\n• (d) ผู้นี้เข้าใจธุรกิจดี จึงสื่อสารกับผู้บริหารได้"},{"n":3,"g":1,"q":"บุคลากรตำแหน่งใดรับผิดชอบหลักในการจัดหาและเตรียมข้อมูลให้พร้อมใช้งาน","c":[{"k":"a","t":"Data Scientist"},{"k":"b","t":"Data Engineer"},{"k":"c","t":"Business Data Analyst"},{"k":"d","t":"Software Developer"}],"ans":"b","e":"Data Engineer รับผิดชอบสร้างและดูแล data pipeline จัดหา รวบรวม ทำความสะอาด และจัดเก็บข้อมูลให้พร้อมใช้ ส่วน Data Scientist เน้นสร้างโมเดล Business Data Analyst เน้นวิเคราะห์และตีความเพื่อธุรกิจ และ Software Developer เน้นพัฒนาซอฟต์แวร์"},{"n":4,"g":1,"q":"เมื่อเรียงระดับการวิเคราะห์ตามความซับซ้อนจากน้อยไปมาก ข้อใดถูกต้อง","c":[{"k":"a","t":"Predictive, Descriptive, Prescriptive"},{"k":"b","t":"Descriptive, Predictive, Prescriptive"},{"k":"c","t":"Prescriptive, Predictive, Descriptive"},{"k":"d","t":"Descriptive, Prescriptive, Predictive"}],"ans":"b","e":"ความซับซ้อนเรียงจากน้อยไปมาก: Descriptive (เกิดอะไรขึ้น) → Predictive (จะเกิดอะไรขึ้น) → Prescriptive (ควรทำอะไร) เพราะ Prescriptive ต้องอาศัยผลพยากรณ์ก่อนแล้วจึงเสนอทางเลือกที่ดีที่สุด"},{"n":5,"g":1,"q":"ระบบที่เลือกและดำเนินการซื้อขายหลักทรัพย์แทนผู้ใช้โดยอัตโนมัติ จัดอยู่ในผลลัพธ์ประเภทใด","c":[{"k":"a","t":"Descriptive Analytics"},{"k":"b","t":"Decision Support"},{"k":"c","t":"Data Exploration"},{"k":"d","t":"Decision Automation"}],"ans":"d","e":"ระบบที่ตัดสินใจและลงมือทำเองโดยไม่ต้องรอมนุษย์ คือ Decision Automation\n• Decision Support เป็นการช่วยให้มนุษย์ตัดสินใจ แต่มนุษย์ยังเป็นผู้ตัดสินใจ\n• Descriptive Analytics และ Data Exploration เป็นการสรุป/สำรวจข้อมูล ไม่ได้ลงมือทำ"},{"n":6,"g":2,"q":"ข้อมูลคอลัมน์หนึ่งมีค่า Q1 = 20 และ Q3 = 32 ค่าขอบบน (upper bound) ตามวิธี IQR เป็นเท่าใด","c":[{"k":"a","t":"44"},{"k":"b","t":"47"},{"k":"c","t":"50"},{"k":"d","t":"56"}],"ans":"c","e":"วิธี IQR: IQR = Q3 − Q1 = 32 − 20 = 12\nUpper bound = Q3 + 1.5 × IQR = 32 + 1.5 × 12 = 32 + 18 = 50\n(Lower bound = Q1 − 1.5 × IQR = 20 − 18 = 2)"},{"n":7,"g":2,"q":"จากข้อ 6 หากข้อมูลในคอลัมน์คือ [8, 22, 25, 28, 30, 32, 55] ค่าใดถูกระบุว่าเป็น outlier","c":[{"k":"a","t":"8"},{"k":"b","t":"32"},{"k":"c","t":"ทั้ง 8 และ 55"},{"k":"d","t":"55"}],"ans":"d","e":"ข้อนี้ระบุว่า “จากข้อ 6” จึงใช้ขอบเขตจากข้อ 6 คือ ต่ำกว่า 2 หรือสูงกว่า 50 จึงเป็น outlier\n• 8 อยู่ในช่วง [2, 50] จึงไม่ใช่ outlier\n• 55 > 50 จึงเป็น outlier\nดังนั้น outlier คือ 55 เท่านั้น\n(หมายเหตุ: ถ้าคำนวณควอร์ไทล์ใหม่จากข้อมูล 7 ค่า Q1 = 22, Q3 = 32, IQR = 10, ขอบเขต 7–47 ก็ยังได้ 55 เป็น outlier เพียงตัวเดียวเช่นกัน)"},{"n":8,"g":2,"q":"ค่าในคอลัมน์หนึ่งมีค่าเฉลี่ย 40 และส่วนเบี่ยงเบนมาตรฐาน 15 หากใช้ช่วง z-score ที่ยอมรับได้เป็น [-2, 2] ค่า 85 จะถูกพิจารณาอย่างไร","c":[{"k":"a","t":"เป็นค่าผิดปกติ เพราะ z-score เท่ากับ 3.0"},{"k":"b","t":"เป็นค่าปกติ เพราะ z-score เท่ากับ 1.8"},{"k":"c","t":"เป็นค่าปกติ เพราะ z-score เท่ากับ 1.5"},{"k":"d","t":"ไม่สามารถสรุปได้ เพราะต้องทราบจำนวนข้อมูลทั้งหมดก่อนจึงจะคำนวณ z-score ได้"}],"ans":"a","e":"z = (x − mean) / SD = (85 − 40) / 15 = 45 / 15 = 3.0\nเนื่องจาก 3.0 อยู่นอกช่วง [−2, 2] จึงเป็นค่าผิดปกติ\nข้อ (d) ผิด เพราะ z-score ใช้เพียงค่าเฉลี่ยและ SD ซึ่งโจทย์ให้มาแล้ว ไม่จำเป็นต้องทราบจำนวนข้อมูล"},{"n":9,"g":2,"q":"คอลัมน์ \"payment\" มีค่า cash, credit และ transfer ควรใช้เทคนิคใดก่อนนำเข้าเทคนิค Logistic Regression","c":[{"k":"a","t":"One-Hot Encoding"},{"k":"b","t":"Standardization"},{"k":"c","t":"Binning"},{"k":"d","t":"การเข้ารหัสตามลำดับเป็น 0, 1 และ 2 ตามลำดับที่ปรากฏในชุดข้อมูล"}],"ans":"a","e":"payment เป็นข้อมูลเชิงกลุ่มแบบ nominal (ไม่มีลำดับ) ต้องแปลงเป็นตัวเลขก่อนใช้กับ Logistic Regression ด้วย One-Hot Encoding แยกเป็นคอลัมน์ 0/1 ต่อหนึ่งกลุ่ม\n• (d) การกำหนด 0,1,2 ทำให้โมเดลเข้าใจว่า transfer > credit > cash ซึ่งไม่จริง\n• (b) Standardization ใช้กับข้อมูลเชิงปริมาณ\n• (c) Binning ใช้แบ่งช่วงค่าตัวเลข"},{"n":10,"g":2,"q":"คำสั่ง Pandas ใดใช้แสดงเฉพาะแถวที่ salary มากกว่า 50000 และ age น้อยกว่า 30","c":[{"k":"a","t":"df[(df[\"salary\"]>50000) & (df[\"age\"]\u003c30)]"},{"k":"b","t":"df[df[\"salary\"]>50000 and df[\"age\"]\u003c30]"},{"k":"c","t":"df[(df[\"salary\"]>50000) | (df[\"age\"]\u003c30)]"},{"k":"d","t":"df.filter(salary=\">50000\", age=\"\u003c30\")"}],"ans":"a","e":"ใน Pandas การกรองด้วยหลายเงื่อนไขต้องใช้ตัวดำเนินการระดับบิต & (และ) และ | (หรือ) โดยครอบแต่ละเงื่อนไขด้วยวงเล็บ\n• (b) ใช้ and ไม่ได้กับ Series จะเกิด ValueError\n• (c) ใช้ | หมายถึง “หรือ” ไม่ตรงกับโจทย์\n• (d) df.filter() ไม่ได้ใช้กรองแถวตามเงื่อนไขแบบนี้"},{"n":11,"g":3,"q":"ข้อมูล [3, 7, 8, 12, 15, 20] มีค่ามัธยฐาน (median) เท่าใด","c":[{"k":"a","t":"8.0"},{"k":"b","t":"9.5"},{"k":"c","t":"10.0"},{"k":"d","t":"12.0"}],"ans":"c","e":"ข้อมูลมี 6 ค่า (เรียงแล้ว) มัธยฐานคือค่าเฉลี่ยของตำแหน่งที่ 3 และ 4 = (8 + 12) / 2 = 10.0"},{"n":12,"g":3,"q":"ข้อมูล [1, 2, 3, 4, 5] มีค่าส่วนเบี่ยงเบนมาตรฐานใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"1.00"},{"k":"b","t":"1.41"},{"k":"c","t":"1.58"},{"k":"d","t":"2.00"}],"ans":"c","e":"ค่าเฉลี่ย = 3, ผลรวมกำลังสองของส่วนเบี่ยงเบน = 4+1+0+1+4 = 10\n• SD ตัวอย่าง (n−1) = √(10/4) = √2.5 ≈ 1.58 ← ค่าเริ่มต้นของ Pandas (.std())\n• SD ประชากร (n) = √(10/5) = √2 ≈ 1.41\nเนื่องจากรายวิชาใช้ Pandas ซึ่งคำนวณแบบตัวอย่างเป็นค่าเริ่มต้น จึงตอบ 1.58 (ถ้าอาจารย์ใช้สูตรประชากร คำตอบจะเป็น (b) 1.41 ควรตรวจสอบกับสูตรที่ใช้ในชั้นเรียน)"},{"n":13,"g":3,"q":"ค่า Pearson Correlation ระหว่างฟีเจอร์ A กับค่าเป้าหมายเท่ากับ 0.05 ควรตีความอย่างไร","c":[{"k":"a","t":"ฟีเจอร์ A มีความสัมพันธ์เชิงเส้นในทิศทางเดียวกันอย่างชัดเจน"},{"k":"b","t":"ฟีเจอร์ A แทบไม่มีความสัมพันธ์เชิงเส้นกับค่าเป้าหมาย"},{"k":"c","t":"ฟีเจอร์ A มีความสัมพันธ์เชิงเส้นในทิศทางตรงกันข้ามอย่างชัดเจน"},{"k":"d","t":"ฟีเจอร์ A เป็นสาเหตุที่ทำให้ค่าเป้าหมายเปลี่ยนแปลงในอัตราร้อยละ 5"}],"ans":"b","e":"Pearson r มีค่า −1 ถึง +1 ค่าใกล้ 0 หมายถึงแทบไม่มีความสัมพันธ์เชิงเส้น 0.05 จึงใกล้ศูนย์มาก\n• (a)/(c) ต้องมี |r| สูง\n• (d) ผิดสองประการ: สหสัมพันธ์ไม่ได้บอกความเป็นสาเหตุ และ 0.05 ไม่ได้แปลว่าเปลี่ยนแปลงร้อยละ 5"},{"n":14,"g":3,"q":"ใน Box Plot เส้นภายในกล่องแสดงค่าใด","c":[{"k":"a","t":"ค่าเฉลี่ย"},{"k":"b","t":"มัธยฐาน"},{"k":"c","t":"ควอไทล์ที่หนึ่ง"},{"k":"d","t":"ค่าสูงสุดที่ไม่นับรวมค่าผิดปกติในชุดข้อมูล"}],"ans":"b","e":"Box Plot: เส้นในกล่องคือมัธยฐาน (Q2) ขอบล่างและขอบบนของกล่องคือ Q1 และ Q3 และหนวด (whisker) แสดงค่าต่ำสุด/สูงสุดที่ไม่ใช่ outlier"},{"n":15,"g":3,"q":"หากต้องการสำรวจว่าฟีเจอร์ใดมีความสัมพันธ์เชิงเส้นกับค่าเป้าหมายมากที่สุด ควรใช้วิธีใด","c":[{"k":"a","t":"พล็อต histogram ของทุกฟีเจอร์"},{"k":"b","t":"พล็อต box plot ของทุกฟีเจอร์พร้อมกัน"},{"k":"c","t":"หาค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐานของทุกฟีเจอร์แล้วนำมาเปรียบเทียบกัน"},{"k":"d","t":"คำนวณค่าสหสัมพันธ์ของทุกฟีเจอร์เทียบกับค่าเป้าหมาย"}],"ans":"d","e":"ค่าสหสัมพันธ์ (Pearson correlation) วัดความสัมพันธ์เชิงเส้นระหว่างแต่ละฟีเจอร์กับค่าเป้าหมายโดยตรง จึงใช้จัดอันดับได้\n• Histogram และ Box plot ดูการกระจายของแต่ละฟีเจอร์ ไม่ได้เทียบกับเป้าหมาย\n• ค่าเฉลี่ยและ SD บอกลักษณะของตัวแปรเดียว ไม่ได้บอกความสัมพันธ์"},{"n":16,"g":4,"q":"สมการ f(x) = 3 + 2x จัดเป็นอะไร","c":[{"k":"a","t":"อัลกอริทึมสำหรับหาค่าสัมประสิทธิ์"},{"k":"b","t":"โมเดลที่พร้อมนำไปคำนวณผลลัพธ์"},{"k":"c","t":"โครงสร้างสมการที่ยังใช้งานจริงไม่ได้"},{"k":"d","t":"ฟังก์ชันการสูญเสียที่ใช้ในกระบวนการเรียนรู้ของโมเดล"}],"ans":"b","e":"f(x) = 3 + 2x มีค่าสัมประสิทธิ์กำหนดครบแล้ว (3 และ 2) แทนค่า x ได้ผลลัพธ์ทันที จึงเป็นโมเดลที่พร้อมใช้งาน\nถ้ามีเพียงโครงสร้าง y = b0 + b1x ที่ยังไม่รู้ค่า b จึงจะเป็นโครงสร้างสมการที่ยังใช้ไม่ได้ ส่วนอัลกอริทึมคือวิธีหาค่าสัมประสิทธิ์ และ loss function คือตัววัดความคลาดเคลื่อน"},{"n":17,"g":4,"q":"โจทย์ \"พยากรณ์จำนวนผู้โดยสารที่จะใช้บริการรถไฟฟ้าในวันพรุ่งนี้\" จัดเป็นการวิเคราะห์แบบใด","c":[{"k":"a","t":"Regression Analysis"},{"k":"b","t":"Classification Analysis"},{"k":"c","t":"Cluster Analysis"},{"k":"d","t":"Prescriptive Analytics"}],"ans":"a","e":"ต้องการพยากรณ์ “จำนวน” ผู้โดยสาร ซึ่งเป็นค่าต่อเนื่องเชิงตัวเลข จึงเป็น Regression\n• Classification ทำนายประเภท/กลุ่ม\n• Cluster Analysis จัดกลุ่มโดยไม่มีค่าเป้าหมาย\n• Prescriptive เสนอแนะการกระทำ"},{"n":18,"g":4,"q":"หลังเสร็จสิ้นการทดสอบด้วย 4-Fold Cross-Validation ควรดำเนินการอย่างไรต่อ","c":[{"k":"a","t":"เลือกโมเดลจากรอบที่ให้ค่าประสิทธิภาพสูงสุดไปใช้งานจริง"},{"k":"b","t":"เลือกโมเดลจากรอบสุดท้ายไปใช้งานจริงเนื่องจากเรียนรู้ข้อมูลมากที่สุด"},{"k":"c","t":"นำโมเดลทั้งสี่รอบมาเฉลี่ยค่าสัมประสิทธิ์เข้าด้วยกันเป็นโมเดลสำหรับใช้งานจริง"},{"k":"d","t":"นำเทคนิคที่เลือกไปเรียนรู้ข้อมูลทั้งหมดเพื่อสร้างโมเดลใช้งานจริง"}],"ans":"d","e":"K-Fold CV ใช้ประเมินและเลือกเทคนิค/ค่าพารามิเตอร์ ไม่ใช่การสร้างโมเดลสุดท้าย เมื่อเลือกเทคนิคได้แล้ว ให้นำเทคนิคนั้นไปเรียนรู้จากข้อมูลทั้งหมดเพื่อสร้างโมเดลใช้งานจริง\n• (a)/(b) แต่ละรอบใช้ข้อมูลเพียงบางส่วน\n• (c) การเฉลี่ยสัมประสิทธิ์ของโมเดลแต่ละรอบไม่ใช่วิธีมาตรฐานและใช้ไม่ได้กับทุกโมเดล"},{"n":19,"g":4,"q":"ในกระบวนการสร้างโมเดล ขั้นตอนใดต้องกระทำก่อนการแปลงรูปข้อมูลบางฟีเจอร์เสมอ","c":[{"k":"a","t":"การเลือกเทคนิคการวิเคราะห์ที่จะใช้สร้างโมเดล"},{"k":"b","t":"การวัดผลการทดสอบด้วยตัวชี้วัดที่เหมาะสม"},{"k":"c","t":"การแบ่งชุดข้อมูลสำหรับสร้างและทดสอบโมเดล"},{"k":"d","t":"การกำหนดค่าอาร์กิวเมนต์ให้กับพารามิเตอร์ของเทคนิคที่เลือกใช้"}],"ans":"c","e":"ต้องแบ่งข้อมูลเป็นชุดสร้างโมเดล (train) และชุดทดสอบ (test) ก่อน แล้วจึงเรียนรู้พารามิเตอร์ของการแปลง (เช่น mean/SD, ตัวเข้ารหัส) จากชุด train เท่านั้น เพื่อป้องกัน data leakage\n• (a), (b), (d) เป็นขั้นตอนที่เกิดหลังหรือเกิดคู่กับการแปลงข้อมูล ไม่ใช่สิ่งที่ “ต้อง” ทำก่อนเสมอ"},{"n":20,"g":5,"q":"จากค่าจริง y = [10, 20, 30] และค่าพยากรณ์ y-hat = [12, 18, 33] ค่า MAE เป็นเท่าใด","c":[{"k":"a","t":"2.33"},{"k":"b","t":"2.00"},{"k":"c","t":"2.38"},{"k":"d","t":"5.67"}],"ans":"a","e":"|ผิดพลาด| = |10−12| = 2, |20−18| = 2, |30−33| = 3\nMAE = (2 + 2 + 3) / 3 = 7/3 ≈ 2.33"},{"n":21,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า MSE เป็นเท่าใด","c":[{"k":"a","t":"2.33"},{"k":"b","t":"2.38"},{"k":"c","t":"4.50"},{"k":"d","t":"5.67"}],"ans":"d","e":"ความคลาดเคลื่อนยกกำลังสอง = 4, 4, 9\nMSE = (4 + 4 + 9) / 3 = 17/3 ≈ 5.67"},{"n":22,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า RMSE มีค่าใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"2.00"},{"k":"b","t":"2.38"},{"k":"c","t":"2.33"},{"k":"d","t":"3.00"}],"ans":"b","e":"RMSE = √MSE = √5.667 ≈ 2.38"},{"n":23,"g":5,"q":"จากข้อมูลชุดเดียวกันในข้อ 20 ค่า MAPE มีค่าใกล้เคียงข้อใดมากที่สุด","c":[{"k":"a","t":"ร้อยละ 13.3"},{"k":"b","t":"ร้อยละ 11.7"},{"k":"c","t":"ร้อยละ 10.0"},{"k":"d","t":"ร้อยละ 20.0"}],"ans":"a","e":"MAPE = (1/n) Σ |y − ŷ| / |y| × 100\n= (1/3) × (2/10 + 2/20 + 3/30) × 100 = (1/3)(0.2 + 0.1 + 0.1) × 100 = 0.4/3 × 100 ≈ 13.3%"},{"n":24,"g":5,"q":"จากโมเดล y-hat = 15.2 + 3.4(x1) - 1.8(x2) หากค่า x2 เพิ่มขึ้น 2 หน่วยโดยที่ x1 คงที่ ค่า y-hat จะเปลี่ยนแปลงอย่างไร","c":[{"k":"a","t":"ลดลง 1.8 หน่วย"},{"k":"b","t":"เพิ่มขึ้น 3.6 หน่วย"},{"k":"c","t":"ลดลง 3.6 หน่วย"},{"k":"d","t":"ไม่สามารถระบุได้"}],"ans":"c","e":"สัมประสิทธิ์ของ x2 คือ −1.8 เมื่อ x2 เพิ่ม 2 หน่วย (x1 คงที่) ŷ เปลี่ยน = −1.8 × 2 = −3.6 คือลดลง 3.6 หน่วย"},{"n":25,"g":5,"q":"กำหนดให้ X = [[1, 2, 1], [1, 3, 2]] และ theta = [1, 2, 3] ค่า y-hat ของแถวแรกเป็นเท่าใด","c":[{"k":"a","t":"6"},{"k":"b","t":"7"},{"k":"c","t":"8"},{"k":"d","t":"13"}],"ans":"c","e":"ŷ = X·θ แถวแรก [1, 2, 1] · [1, 2, 3] = 1×1 + 2×2 + 1×3 = 1 + 4 + 3 = 8"},{"n":26,"g":5,"q":"ในเทคนิค Gradient Descent ค่า Learning Rate ที่น้อยเกินไปจะส่งผลอย่างไร","c":[{"k":"a","t":"การปรับค่าในแต่ละรอบอาจก้าวข้ามจุดที่เหมาะสม"},{"k":"b","t":"ค่าสัมประสิทธิ์จะไม่เปลี่ยนแปลงเลยตลอดกระบวนการ"},{"k":"c","t":"ต้องใช้จำนวนรอบมากขึ้นกว่าจะได้ค่าที่เหมาะสม"},{"k":"d","t":"ค่าความคลาดเคลื่อนจะเพิ่มขึ้นเรื่อย ๆ จนกระบวนการเรียนรู้ล้มเหลว"}],"ans":"c","e":"Learning rate น้อยเกินไปทำให้ก้าวปรับค่าเล็กมาก จึงลู่เข้าสู่ค่าที่เหมาะสมช้า ต้องใช้จำนวนรอบมากขึ้น\n• (a) และ (d) เป็นอาการของ learning rate ที่มากเกินไป (ก้าวข้ามจุดต่ำสุด/ลู่ออก)\n• (b) ค่ายังเปลี่ยนแปลงอยู่ เพียงเปลี่ยนช้า"},{"n":27,"g":6,"q":"ระบบตรวจจับอีเมลขยะทำนายว่าอีเมลฉบับหนึ่งไม่ใช่อีเมลขยะ แต่ความจริงเป็นอีเมลขยะ กรณีนี้จัดเป็นอะไร","c":[{"k":"a","t":"True-Positive"},{"k":"b","t":"True-Negative"},{"k":"c","t":"False-Positive"},{"k":"d","t":"False-Negative"}],"ans":"d","e":"ระบบทำนาย “ไม่ใช่ขยะ” (Negative) แต่ความจริงเป็น “ขยะ” (Positive) = ทำนายลบแต่จริงเป็นบวก จึงเป็น False-Negative (พลาดการจับ)"},{"n":28,"g":6,"q":"จากเมทริกซ์คอนฟิวชัน TP = 30, TN = 40, FP = 10, FN = 20 ค่า Accuracy เป็นเท่าใด","c":[{"k":"a","t":"0.60"},{"k":"b","t":"0.70"},{"k":"c","t":"0.65"},{"k":"d","t":"0.75"}],"ans":"b","e":"Accuracy = (TP + TN) / (TP + TN + FP + FN) = (30 + 40) / (30 + 40 + 10 + 20) = 70/100 = 0.70"},{"n":29,"g":6,"q":"ชุดข้อมูลตรวจจับการทุจริตมี 1,000 รายการ เป็นรายการทุจริตเพียง 20 รายการ หากโมเดลทำนายว่าทุกรายการไม่ทุจริต จะเกิดปัญหาใดกับการวัดผลด้วย Accuracy","c":[{"k":"a","t":"ค่า Accuracy จะต่ำมากจนไม่สามารถตีความได้"},{"k":"b","t":"ค่า Accuracy จะสูงมากทั้งที่โมเดลไม่มีประโยชน์"},{"k":"c","t":"ค่า Accuracy จะเท่ากับศูนย์เนื่องจากไม่มีการทำนายคลาสบวก"},{"k":"d","t":"ค่า Accuracy จะคำนวณไม่ได้เนื่องจากตัวส่วนของสมการมีค่าเป็นศูนย์"}],"ans":"b","e":"ถ้าทำนายว่าไม่ทุจริตทั้งหมด จะถูก 980 จาก 1,000 รายการ Accuracy = 98% ทั้งที่โมเดลจับการทุจริตไม่ได้เลย (Recall = 0) นี่คือปัญหาของข้อมูลไม่สมดุล (imbalanced data) ที่ควรใช้ Precision, Recall, F1 ประกอบ"},{"n":30,"g":6,"q":"หากแบ่งข้อมูลได้ 8 ตัวอย่าง เป็นคลาส A จำนวน 6 ตัวอย่าง และคลาส B จำนวน 2 ตัวอย่าง ค่า GINI เป็นเท่าใด","c":[{"k":"a","t":"0.250"},{"k":"b","t":"0.375"},{"k":"c","t":"0.320"},{"k":"d","t":"0.500"}],"ans":"b","e":"Gini = 1 − Σ pᵢ² โดย p(A) = 6/8 = 0.75, p(B) = 2/8 = 0.25\nGini = 1 − (0.5625 + 0.0625) = 1 − 0.625 = 0.375"},{"n":31,"g":6,"q":"ในสมการ Logistic Regression P = 1 / (1 + e^-(b0 + BX)) หากค่าในวงเล็บเท่ากับ 0 ค่า P จะเป็นเท่าใด","c":[{"k":"a","t":"0.00"},{"k":"b","t":"0.25"},{"k":"c","t":"1.00"},{"k":"d","t":"0.50"}],"ans":"d","e":"P = 1/(1 + e^−0) = 1/(1 + 1) = 0.50 (จุดตัดสินใจของ sigmoid)"},{"n":32,"g":7,"q":"ข้อมูลหนึ่งมิติ [1, 2, 6, 7, 8] ใช้ K-Means โดย K = 2 เริ่มต้นจุดศูนย์กลางที่ตำแหน่ง 1 และ 5 หลังรอบแรกจุดศูนย์กลางฝั่งขวาจะอยู่ที่ตำแหน่งใด","c":[{"k":"a","t":"5.0"},{"k":"b","t":"7.0"},{"k":"c","t":"6.5"},{"k":"d","t":"8.0"}],"ans":"b","e":"จุดศูนย์กลางเริ่มต้น c1 = 1, c2 = 5\nจัดกลุ่ม: 1 → c1; 2 → c1 (ห่าง 1 เทียบกับ 3); 6, 7, 8 → c2\nคำนวณจุดศูนย์กลางใหม่ของกลุ่มขวา = (6 + 7 + 8)/3 = 7.0 (กลุ่มซ้าย = (1+2)/2 = 1.5)"},{"n":33,"g":7,"q":"จากข้อ 32 เมื่อกระบวนการเสร็จสิ้น สมาชิกของกลุ่มที่มีจุดศูนย์กลางค่าน้อยกว่าคือข้อใด","c":[{"k":"a","t":"{1, 2}"},{"k":"b","t":"{1, 2, 6}"},{"k":"c","t":"{6, 7, 8}"},{"k":"d","t":"{1, 2, 6, 7, 8}"}],"ans":"a","e":"รอบถัดไปใช้ c1 = 1.5, c2 = 7 : จุด 6 ห่างจาก c1 = 4.5 และห่างจาก c2 = 1 จึงยังอยู่กลุ่มขวา การจัดกลุ่มไม่เปลี่ยน จึงลู่เข้า\nกลุ่มที่มีจุดศูนย์กลางน้อยกว่า (1.5) คือ {1, 2}"},{"n":34,"g":7,"q":"กำหนดข้อมูลหนึ่งมิติ P = {2, 3, 4, 5, 12, 13, 30} ใช้ DBSCAN โดย eps = 1.5 และ min_samples = 3 (นับตัวเองด้วย) จุดใดเป็น core point","c":[{"k":"a","t":"3 และ 4"},{"k":"b","t":"12 และ 13"},{"k":"c","t":"2 และ 5"},{"k":"d","t":"2, 3, 4 และ 5"}],"ans":"a","e":"Core point คือจุดที่มีเพื่อนบ้านภายในรัศมี eps = 1.5 (รวมตัวเอง) ≥ 3 จุด\n• 2: {2, 3} = 2 ✗\n• 3: {2, 3, 4} = 3 ✓\n• 4: {3, 4, 5} = 3 ✓\n• 5: {4, 5} = 2 ✗\n• 12: {12, 13} = 2 ✗, 13: {12, 13} = 2 ✗, 30: {30} = 1 ✗\nดังนั้น core point คือ 3 และ 4"},{"n":35,"g":7,"q":"จากข้อ 34 จำนวน noise point เป็นเท่าใด","c":[{"k":"a","t":"3 จุด"},{"k":"b","t":"2 จุด"},{"k":"c","t":"1 จุด"},{"k":"d","t":"4 จุด"}],"ans":"a","e":"จุด 2 และ 5 เป็น border point (ไม่ใช่ core แต่อยู่ในรัศมีของ core 3 และ 4)\nจุด 12, 13 และ 30 ไม่เป็น core และไม่อยู่ในรัศมีของ core ใดเลย จึงเป็น noise = 3 จุด"},{"n":36,"g":7,"q":"เหตุใดจึงไม่สามารถใช้ค่า Accuracy วัดผลการทำ Cluster Analysis ได้","c":[{"k":"a","t":"เพราะจำนวนกลุ่มที่ได้มักไม่เท่ากับจำนวนกลุ่มที่คาดหวังไว้"},{"k":"b","t":"เพราะไม่มีค่าคลาสจริงไว้ใช้เปรียบเทียบกับผลการจัดกลุ่ม"},{"k":"c","t":"เพราะสมาชิกในแต่ละกลุ่มมีจำนวนไม่เท่ากันจึงเกิดสภาวะไม่สมดุล"},{"k":"d","t":"เพราะผลการจัดกลุ่มเปลี่ยนแปลงทุกครั้งที่รันจากการสุ่มค่าเริ่มต้น"}],"ans":"b","e":"Accuracy ต้องเทียบคำตอบที่ทำนายกับค่าคลาสจริง แต่ Cluster Analysis เป็น unsupervised learning ไม่มีคลาสจริงให้เปรียบเทียบ จึงต้องใช้ตัวชี้วัดอื่น เช่น Silhouette, SSE/Inertia"},{"n":37,"g":8,"q":"รายการแนะนำเรียงคะแนนจากมากไปน้อย 8 รายการ โดยมี test item อยู่ในลำดับที่ 1 และ 4 หากกำหนด K = 5 ค่า Top-K Precision เป็นเท่าใด","c":[{"k":"a","t":"0.25"},{"k":"b","t":"0.33"},{"k":"c","t":"0.50"},{"k":"d","t":"0.40"}],"ans":"d","e":"Top-K Precision = จำนวน test item ที่อยู่ใน K อันดับแรก / K\nTest item อยู่อันดับ 1 และ 4 ซึ่งอยู่ใน top 5 ทั้งคู่ = 2 รายการ\nPrecision@5 = 2/5 = 0.40"},{"n":38,"g":8,"q":"จากข้อ 37 ค่า hit@5 เป็นเท่าใด","c":[{"k":"a","t":"1"},{"k":"b","t":"0.4"},{"k":"c","t":"0"},{"k":"d","t":"2"}],"ans":"a","e":"hit@K = 1 ถ้ามี test item อย่างน้อยหนึ่งรายการอยู่ใน top K มิฉะนั้นเป็น 0 เนื่องจากมี test item อยู่อันดับ 1 และ 4 ใน top 5 จึงได้ hit@5 = 1 (ไม่ใช่จำนวนที่พบ)"},{"n":39,"g":8,"q":"ในการหาค่า AUC ของระบบแนะนำ หากมีการเปรียบเทียบทั้งหมด 10 คู่ โดยชนะ 8 คู่ และเสมอ 2 คู่ ค่า AUC เป็นเท่าใด","c":[{"k":"a","t":"0.80"},{"k":"b","t":"0.85"},{"k":"c","t":"1.00"},{"k":"d","t":"0.90"}],"ans":"d","e":"AUC = (จำนวนคู่ที่ชนะ + 0.5 × จำนวนคู่ที่เสมอ) / จำนวนคู่ทั้งหมด = (8 + 0.5×2)/10 = 9/10 = 0.90"},{"n":40,"g":8,"q":"ระบบแนะนำสินค้าที่เพิ่งเปิดตัวและยังไม่มีประวัติการซื้อของผู้ใช้ ควรเริ่มต้นด้วยแนวทางใด","c":[{"k":"a","t":"Collaborative Filtering เนื่องจากให้ผลแม่นยำที่สุด"},{"k":"b","t":"Community Detection เพื่อจัดกลุ่มผู้ใช้ที่มีพฤติกรรมคล้ายกันก่อนการแนะนำ"},{"k":"c","t":"Matrix Factorization เนื่องจากรองรับข้อมูลขนาดใหญ่ได้ดี"},{"k":"d","t":"Recommend by Product Features หรือ Knowledge Base"}],"ans":"d","e":"สินค้าที่เพิ่งเปิดตัวไม่มีประวัติผู้ใช้ (Cold start) วิธีที่อิงพฤติกรรมผู้ใช้ เช่น Collaborative Filtering, Matrix Factorization และ Community Detection จึงใช้ไม่ได้ผล ควรเริ่มจากการแนะนำด้วยคุณสมบัติสินค้า (content-based) หรือ Knowledge Base"},{"n":41,"g":9,"q":"ในการแสดงยอดขายรายเดือนตลอดทั้งปี องค์ประกอบภาพใดเหมาะสมที่สุด","c":[{"k":"a","t":"เฉดสีที่แตกต่างกันในแต่ละเดือน"},{"k":"b","t":"ความสว่างของสีที่ไล่ระดับตามยอดขาย"},{"k":"c","t":"ตำแหน่งของจุดบนแผนภูมิเส้น"},{"k":"d","t":"ขนาดพื้นที่ของวงกลมที่แปรผันตามยอดขายในแต่ละเดือน"}],"ans":"c","e":"ข้อมูลเชิงปริมาณเรียงตามเวลา แสดงแนวโน้มได้ดีที่สุดด้วยตำแหน่ง (จุดบนแผนภูมิเส้น) เพราะมนุษย์รับรู้และเปรียบเทียบตำแหน่งได้แม่นยำที่สุด\n• เฉดสีไม่มีลำดับ • ความสว่างแยกได้ไม่กี่ระดับ • ขนาดพื้นที่วงกลมเปรียบเทียบได้ไม่แม่นยำ"},{"n":42,"g":9,"q":"เหตุใดจึงไม่ควรใช้เฉดสี (Hue) แทนค่าเชิงปริมาณ","c":[{"k":"a","t":"เพราะจอแสดงผลแต่ละเครื่องแสดงเฉดสีได้แตกต่างกันจนอาจทำให้ตีความผิดพลาด"},{"k":"b","t":"เพราะเฉดสีทำให้ต้นทุนการพิมพ์เอกสารสูงขึ้นอย่างมาก"},{"k":"c","t":"เพราะเฉดสีมีจำนวนจำกัดไม่เพียงพอต่อข้อมูลเชิงปริมาณ"},{"k":"d","t":"เพราะเฉดสีไม่มีลำดับตามธรรมชาติที่มนุษย์รับรู้ได้"}],"ans":"d","e":"เฉดสี (Hue) ไม่มีลำดับตามธรรมชาติที่มนุษย์รับรู้ได้ (เช่น เขียวมากกว่าน้ำเงินหรือไม่?) จึงเหมาะกับข้อมูลเชิงกลุ่ม ไม่เหมาะกับข้อมูลเชิงปริมาณที่ต้องมีลำดับ"},{"n":43,"g":9,"q":"เหตุใดจึงแนะนำให้ใช้ความสว่าง (Brightness) แทนค่าเชิงปริมาณไม่เกิน 3-5 ระดับ","c":[{"k":"a","t":"เพราะสายตามนุษย์แยกแยะระดับความเข้มที่ใกล้เคียงกันได้ยาก"},{"k":"b","t":"เพราะเครื่องมือสร้างแผนภูมิรองรับได้จำกัดเพียงเท่านั้น"},{"k":"c","t":"เพราะการใช้หลายระดับทำให้ไฟล์ภาพมีขนาดใหญ่เกินความจำเป็น"},{"k":"d","t":"เพราะระดับความสว่างที่มากกว่านั้นจะทำให้สับสนกับการใช้เฉดสีที่แตกต่างกัน"}],"ans":"a","e":"สายตามนุษย์แยกระดับความสว่างที่ใกล้เคียงกันได้ยาก จึงควรใช้เพียงประมาณ 3–5 ระดับเพื่อให้แต่ละระดับแยกออกจากกันได้ชัดเจน"},{"n":44,"g":9,"q":"เหตุใดจึงแนะนำ Doughnut Chart มากกว่า Pie Chart","c":[{"k":"a","t":"เพราะชี้นำให้ผู้อ่านเปรียบเทียบความยาวส่วนโค้งเพียงมิติเดียว"},{"k":"b","t":"เพราะสีที่ใช้ในแต่ละส่วนมีความชัดเจนและแยกแยะได้ง่ายกว่าเดิม"},{"k":"c","t":"เพราะสามารถแสดงจำนวนกลุ่มข้อมูลได้มากกว่าในพื้นที่เท่ากัน"},{"k":"d","t":"เพราะสามารถแสดงค่าร้อยละของแต่ละส่วนไว้ตรงกลางแผนภูมิได้อย่างสะดวก"}],"ans":"a","e":"Pie chart ผู้อ่านมักเปรียบเทียบด้วยมุมหรือพื้นที่ ส่วน Doughnut chart ที่เจาะรูกลางทำให้ผู้อ่านเปรียบเทียบความยาวส่วนโค้ง (มิติเดียว) ซึ่งรับรู้ได้แม่นยำกว่า จึงเป็นเหตุผลที่แนะนำ"},{"n":45,"g":9,"q":"ในการนำเสนอจำนวนผู้ใช้งานแยกตามระบบปฏิบัติการซึ่งเป็นข้อมูลเชิงกลุ่ม ควรใช้องค์ประกอบภาพใดแทนชื่อกลุ่ม","c":[{"k":"a","t":"ความสว่างของสี"},{"k":"b","t":"ความหนาของเส้น"},{"k":"c","t":"เฉดสีที่แตกต่างกัน"},{"k":"d","t":"ขนาดพื้นที่ของรูปทรงเรขาคณิตที่แสดงบนแผนภูมิ"}],"ans":"c","e":"ข้อมูลเชิงกลุ่ม (nominal) เช่น ระบบปฏิบัติการ ควรแทนชื่อกลุ่มด้วยเฉดสีที่แตกต่างกัน เพราะเฉดสีไม่มีลำดับ จึงเหมาะกับการแยกประเภท ส่วนความสว่าง ความหนา และขนาดพื้นที่เหมาะกับค่าเชิงปริมาณหรือมีลำดับ"},{"n":46,"g":9,"q":"เหตุใดผู้ออกแบบรายงานจึงต้องคำนึงถึงบริบททางวัฒนธรรมของผู้อ่าน (Localization)","c":[{"k":"a","t":"เพราะผู้อ่านแต่ละวัฒนธรรมมีความสามารถในการอ่านแผนภูมิต่างกัน"},{"k":"b","t":"เพราะรูปแบบตัวอักษรที่ใช้ในแต่ละภาษามีความกว้างไม่เท่ากัน"},{"k":"c","t":"เพราะความหมายของสีในบางเรื่องแตกต่างกันในแต่ละวัฒนธรรม"},{"k":"d","t":"เพราะมาตรฐานการวัดหน่วยของแต่ละประเทศแตกต่างกันจนอาจตีความคลาดเคลื่อน"}],"ans":"c","e":"Localization: สีเดียวกันมีความหมายต่างกันตามวัฒนธรรม เช่น สีขาว สีแดง สีเขียว อาจสื่อความหมายดี/ร้าย หรือขึ้น/ลงต่างกัน ผู้ออกแบบจึงต้องเลือกใช้สีให้เหมาะสมกับผู้อ่าน"},{"n":47,"g":9,"q":"เหตุใดการใช้ความยาวคลื่นของสีไล่จากม่วงไปแดงแทนค่าเชิงปริมาณจึงไม่เป็นที่แนะนำ","c":[{"k":"a","t":"เพราะสายตามนุษย์ไม่สามารถแยกแยะความแตกต่างของสีในย่านดังกล่าวได้"},{"k":"b","t":"เพราะเครื่องมือสร้างแผนภูมิส่วนใหญ่ไม่รองรับการกำหนดสีในลักษณะนี้"},{"k":"c","t":"เพราะมาตรฐานการแสดงผลสีของอุปกรณ์แต่ละชนิดมีความแตกต่างกันอย่างมีนัยสำคัญ"},{"k":"d","t":"เพราะลำดับตามความยาวคลื่นไม่ใช่ลำดับที่มนุษย์รับรู้ได้โดยธรรมชาติ"}],"ans":"d","e":"การไล่สีตามความยาวคลื่น (ม่วง→แดง) ไม่ใช่ลำดับที่มนุษย์รับรู้ได้ตามธรรมชาติว่าสีใด “มากกว่า” สีใด แม้สายตาจะแยกสีได้ก็ตาม ข้อ (a) จึงไม่ใช่เหตุผลที่ถูกต้อง"},{"n":48,"g":9,"q":"เหตุใดแผนภูมิแท่งสามมิติแบบซ้อนจึงไม่เป็นที่แนะนำในการนำเสนอผลการวิเคราะห์","c":[{"k":"a","t":"เพราะใช้พื้นที่ในการแสดงผลมากกว่าแผนภูมิรูปแบบอื่น"},{"k":"b","t":"เพราะไม่สามารถแสดงข้อมูลหลายกลุ่มพร้อมกันได้อย่างครบถ้วน"},{"k":"c","t":"เพราะผู้อ่านต้องใช้ความพยายามในการตีความมากเกินจำเป็น"},{"k":"d","t":"เพราะโปรแกรมสร้างแผนภูมิสมัยใหม่ได้ยกเลิกการรองรับรูปแบบนี้แล้ว"}],"ans":"c","e":"แผนภูมิแท่งสามมิติแบบซ้อนทำให้เกิดการบดบัง มุมมองบิดเบือน และเปรียบเทียบค่าลำบาก ผู้อ่านต้องใช้ความพยายามตีความมาก ขัดกับเป้าหมายที่ต้องสื่อสารให้เข้าใจง่าย"},{"n":49,"g":9,"q":"ข้อใดคือเป้าหมายสำคัญที่สุดของการนำเสนอข้อมูลเชิงภาพ","c":[{"k":"a","t":"ทำให้รายงานมีความสวยงามน่าสนใจมากขึ้น"},{"k":"b","t":"แสดงข้อมูลให้ครบถ้วนทุกรายการเท่าที่จะเป็นไปได้โดยไม่ตกหล่นแม้แต่รายการเดียว"},{"k":"c","t":"ทำให้ผู้รับสารเข้าใจประเด็นสำคัญได้อย่างรวดเร็วและนำไปตัดสินใจได้"},{"k":"d","t":"ลดจำนวนหน้ากระดาษของรายงานลงเพื่อประหยัดทรัพยากรในการจัดพิมพ์"}],"ans":"c","e":"เป้าหมายหลักของ Data Visualization คือสื่อสารประเด็นสำคัญให้ผู้รับสารเข้าใจได้รวดเร็วและนำไปตัดสินใจได้ ความสวยงามหรือการแสดงข้อมูลครบทุกรายการไม่ใช่เป้าหมายหลัก"},{"n":50,"g":9,"q":"ในการแสดงปริมาณการเข้าชมเว็บไซต์แยกตามประเทศบนแผนที่โลก ควรใช้องค์ประกอบภาพใดร่วมกับตำแหน่ง","c":[{"k":"a","t":"เฉดสีที่แตกต่างกันในแต่ละประเทศ"},{"k":"b","t":"ความหนาของเส้นขอบเขตแต่ละประเทศ"},{"k":"c","t":"ความสว่างของสีที่ไล่ระดับตามปริมาณ"},{"k":"d","t":"รูปทรงเรขาคณิตที่แตกต่างกันตามระดับปริมาณการเข้าชมของแต่ละประเทศ"}],"ans":"c","e":"บนแผนที่ ตำแหน่งถูกใช้แทนประเทศแล้ว จึงต้องใช้ตัวแปรภาพอื่นแทนปริมาณ คือ ความสว่างของสีที่ไล่ระดับ (choropleth map) ส่วนเฉดสีเหมาะกับข้อมูลเชิงกลุ่ม และรูปทรง/ความหนาเส้นไม่เหมาะกับการสื่อปริมาณบนแผนที่"}]};
const $=s=>document.querySelector(s),app=$('#app');
let state;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
$('#theme').onclick=()=>{const d=document.documentElement;const dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0f141c';d.dataset.theme=dark?'light':'dark'};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function home(){
  const best=store.get('best');
  app.innerHTML=`<div class="card">
   <h2 style="margin-top:0">เลือกชุดข้อสอบ</h2>
   <p style="color:var(--muted)">ตอบแล้วเห็นเฉลยและคำอธิบายทันที มีทั้งหมด ${DATA.qs.length} ข้อ ${DATA.groups.length} กลุ่ม${best!=null?` · คะแนนดีที่สุดของคุณ: <b>${best}%</b>`:''}</p>
   <div class="grid">
    <label class="opt2"><input type="checkbox" id="all" checked> <b>ทุกกลุ่ม (${DATA.qs.length} ข้อ)</b></label>
    ${DATA.groups.map(g=>`<label class="opt2"><input type="checkbox" class="g" value="${g.id}" checked> กลุ่มที่ ${g.id}: ${esc(g.name)} <span style="margin-left:auto;color:var(--muted)">${DATA.qs.filter(q=>q.g===g.id).length} ข้อ</span></label>`).join('')}
    <label class="opt2"><input type="checkbox" id="shuf"> สลับลำดับข้อ</label>
   </div>
   <button class="btn" id="start">เริ่มทำข้อสอบ</button></div>`;
  const all=$('#all'),gs=[...document.querySelectorAll('.g')];
  all.onchange=()=>gs.forEach(c=>c.checked=all.checked);
  gs.forEach(c=>c.onchange=()=>all.checked=gs.every(x=>x.checked));
  $('#start').onclick=()=>{
    const ids=gs.filter(c=>c.checked).map(c=>+c.value);
    if(!ids.length){alert('กรุณาเลือกอย่างน้อย 1 กลุ่ม');return}
    let qs=DATA.qs.filter(q=>ids.includes(q.g));
    if($('#shuf').checked)qs=shuffle(qs);
    start(qs);
  };
}
function start(qs){state={qs,i:0,ans:{}};render()}
function render(){
  const {qs,i,ans}=state,q=qs[i],picked=ans[i],done=picked!=null;
  const g=DATA.groups.find(x=>x.id===q.g);
  const correct=qs.filter((x,j)=>ans[j]===x.ans).length,answered=Object.keys(ans).length;
  app.innerHTML=`<div class="card">
   <div class="meta"><span>ข้อ ${i+1} / ${qs.length}</span><span>ถูก ${correct} / ตอบแล้ว ${answered}</span></div>
   <div class="bar"><i style="width:${(i+(done?1:0))/qs.length*100}%"></i></div>
   <span class="tag">กลุ่มที่ ${g.id}: ${esc(g.name)}</span>
   <div class="q">${q.n}. ${esc(q.q)}</div>
   <div class="opts">${q.c.map(o=>{let cls='';if(done){if(o.k===q.ans)cls='ok';else if(o.k===picked)cls='bad'}
     return `<button class="opt ${cls}" data-k="${o.k}" ${done?'disabled':''}><span class="k">${o.k.toUpperCase()}</span><span>${esc(o.t)}</span></button>`}).join('')}</div>
   ${done?`<div class="exp ${picked===q.ans?'ok':'bad'}"><b class="h">${picked===q.ans?'✔ ถูกต้อง!':'✘ ยังไม่ถูก — คำตอบที่ถูกคือ ('+q.ans+')'}</b><p>${esc(q.e)}</p></div>`:''}
   <div class="nav"><button class="btn sec" id="prev" ${i===0?'disabled':''}>← ก่อนหน้า</button>
   <button class="btn" id="next" ${done?'':'disabled'}>${i===qs.length-1?'ดูผลคะแนน':'ข้อถัดไป →'}</button></div>
   <div class="dots">${qs.map((x,j)=>`<button class="dot ${ans[j]!=null?(ans[j]===x.ans?'ok':'bad'):''} ${j===i?'cur':''}" data-j="${j}">${j+1}</button>`).join('')}</div>
  </div>
  <p style="text-align:center"><button class="icon" id="quit">กลับหน้าแรก</button></p>`;
  document.querySelectorAll('.opt:not(:disabled)').forEach(b=>b.onclick=()=>{state.ans[i]=b.dataset.k;render();document.querySelector('.exp')?.scrollIntoView({block:'nearest',behavior:'smooth'})});
  $('#prev').onclick=()=>{state.i--;render()};
  $('#next').onclick=()=>{if(i===qs.length-1)result();else{state.i++;render();window.scrollTo(0,0)}};
  document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{state.i=+d.dataset.j;render()});
  $('#quit').onclick=()=>{if(confirm('ออกจากข้อสอบและกลับหน้าแรก?'))home()};
}
function result(){
  const {qs,ans}=state,right=qs.filter((x,j)=>ans[j]===x.ans).length,pct=Math.round(right/qs.length*100);
  if(qs.length===DATA.qs.length){const b=store.get('best');if(b==null||pct>b)store.set('best',pct)}
  const wrong=qs.map((x,j)=>({x,j})).filter(o=>ans[o.j]!==o.x.ans);
  const msg=pct>=80?'ยอดเยี่ยมมาก! 🎉':pct>=60?'ทำได้ดี สู้ต่ออีกนิด 💪':'ลองทบทวนข้อที่พลาดแล้วทำใหม่อีกครั้ง 📚';
  app.innerHTML=`<div class="card" style="text-align:center"><p style="margin:0;color:var(--muted)">คะแนนของคุณ</p><p class="score">${right} / ${qs.length}</p><p>${pct}% — ${msg}</p>
   <button class="btn" id="again">ทำใหม่</button> <button class="btn sec" id="home">กลับหน้าแรก</button>
   ${wrong.length?`<button class="btn sec" id="redo">ทำเฉพาะข้อที่ผิด (${wrong.length})</button>`:''}</div>
   ${wrong.length?`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">ข้อที่ตอบผิด</h3>${wrong.map(({x,j})=>`<div class="rev"><b>${x.n}. ${esc(x.q)}</b><br>คุณตอบ: (${ans[j]}) ${esc(x.c.find(o=>o.k===ans[j]).t)}<br><span style="color:var(--ok)">เฉลย: (${x.ans}) ${esc(x.c.find(o=>o.k===x.ans).t)}</span><p style="color:var(--muted);white-space:pre-wrap;margin:6px 0 0">${esc(x.e)}</p></div>`).join('')}</div>`:''}`;
  $('#again').onclick=()=>start(qs);$('#home').onclick=home;
  const r=$('#redo');if(r)r.onclick=()=>start(wrong.map(o=>o.x));
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
